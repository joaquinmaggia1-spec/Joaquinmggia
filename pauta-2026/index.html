      :root {

        --color-alert: #ff3b4e;
        --color-ink: #ffffff;
        --color-ground: #0b0b0c;
        --font-display: "Montserrat";
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--color-ground);
      }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--color-ground); }
      .vw { position: absolute; inset: 0; transform-origin: 50% 40%; }
      .vw video { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; object-fit: cover; }
    </style>
  </head>
  <body>

      data-width="1080"

      <!-- SFX (Pixabay, bundled) -->

    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      // Punch-ins on the beat (hard, like the reference)
      tl.set("#w-s1", { scale: 1 }, 0).set("#w-s1", { scale: 1.12 }, 1.6);
      tl.set("#w-s2", { scale: 1 }, 3.2).set("#w-s2", { scale: 1.14 }, 4.15);
      tl.fromTo("#w-s3", { scale: 1.08 }, { scale: 1, duration: 2.8, ease: "power1.out" }, 6.4);
      tl.set("#w-s5", { scale: 1 }, 11.6).set("#w-s5", { scale: 1.12 }, 13.4);
      tl.set("#w-s6", { scale: 1 }, 15).set("#w-s6", { scale: 1.12 }, 16.8);
      tl.set("#w-s7", { scale: 1 }, 18.4).set("#w-s7", { scale: 1.1 }, 20.2);
      tl.set("#w-s9", { scale: 1 }, 26.2).set("#w-s9", { scale: 1.12 }, 28.1);
      // Whip blur into each new shot
      ["#w-s2", "#w-s3", "#w-s5", "#w-s6", "#w-s7", "#w-s8a", "#w-s9"].forEach((id, i) => {
        const t = [3.2, 6.4, 11.6, 15, 18.4, 21.8, 26.2][i];
        tl.fromTo(id, { filter: "blur(14px)" }, { filter: "blur(0px)", duration: 0.16, ease: "power3.out" }, t);
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
