<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Siempre Gano — Trabajá como Cajer@</title>
<meta name="description" content="Trabajá como cajer@ de Siempre Gano. 30% de comisión sin recupero. Cupos limitados.">
<meta name="theme-color" content="#0a0704">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0704;
    --gold-1: #fff3c4;
    --gold-2: #f5c84c;
    --gold-3: #c08a1e;
    --gold-4: #6e4a0c;
    --red: #d81f26;
    --wpp: #25d366;
    --wpp-dark: #128c4a;
    --gold-text: linear-gradient(180deg, var(--gold-1) 0%, var(--gold-2) 38%, var(--gold-3) 70%, #8a5d12 100%);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: #fff;
    font-family: "Montserrat", system-ui, sans-serif;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    position: relative;
    height: 100vh;
    height: 100svh;
    max-width: 520px;
    margin: 0 auto;
    padding: max(16px, env(safe-area-inset-top)) 16px max(14px, env(safe-area-inset-bottom));
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    gap: clamp(6px, 1.6svh, 16px);
    text-align: center;
    isolation: isolate;
  }

  /* Fondo: bokeh dorado + viñeta */
  .bg {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(circle at 15% 12%, rgba(245,200,76,.35) 0 3%, transparent 4%),
      radial-gradient(circle at 82% 8%, rgba(245,200,76,.25) 0 4%, transparent 5.5%),
      radial-gradient(circle at 90% 40%, rgba(245,200,76,.18) 0 3%, transparent 4.5%),
      radial-gradient(circle at 8% 55%, rgba(245,200,76,.15) 0 5%, transparent 6.5%),
      radial-gradient(circle at 70% 88%, rgba(245,200,76,.18) 0 4%, transparent 5.5%),
      radial-gradient(ellipse at 50% 30%, #3a2508 0%, #1a1005 45%, var(--bg) 80%);
  }
  .bg::after {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,.75) 100%);
  }
  .glyphs {
    position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
  }
  .glyphs span {
    position: absolute; color: var(--gold-2); opacity: .08; font-size: 42px;
    animation: float 9s ease-in-out infinite;
  }
  @keyframes float { 50% { transform: translateY(-14px) rotate(8deg); } }

  .gold {
    background: var(--gold-text);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    filter: drop-shadow(0 2px 0 #3d2805) drop-shadow(0 4px 10px rgba(0,0,0,.6));
  }

  /* Logo */
  .logo {
    position: relative;
    width: clamp(150px, 30svh, 250px);
    aspect-ratio: 1;
    border-radius: 50%;
    display: grid; place-items: center;
    background: radial-gradient(circle at 50% 35%, #2b1d08, #0b0703 70%);
    border: 3px solid var(--gold-2);
    box-shadow:
      0 0 0 5px #1a1004,
      0 0 0 8px var(--gold-3),
      0 0 40px rgba(245,200,76,.35),
      inset 0 0 30px rgba(245,200,76,.15);
    flex-shrink: 0;
    margin-top: clamp(18px, 3.5svh, 30px);
  }
  .crown {
    position: absolute; top: -14%; left: 50%; transform: translateX(-50%);
    font-size: clamp(30px, 6svh, 48px); line-height: 1;
  }
  .logo-inner { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .logo-title {
    font-family: "Anton", sans-serif;
    font-size: clamp(30px, 6.4svh, 54px);
    line-height: .95; letter-spacing: .5px;
  }
  .logo-sub {
    margin-top: 4px;
    font-size: clamp(8px, 1.3svh, 11px); font-weight: 800; letter-spacing: 3px;
    color: var(--gold-2);
    border-top: 1px solid var(--gold-3); border-bottom: 1px solid var(--gold-3);
    padding: 2px 8px;
  }
  .logo-777 {
    margin-top: 4px;
    font-family: "Anton", sans-serif; font-size: clamp(12px, 2svh, 18px);
    color: var(--red); background: #f9e7a8; border-radius: 4px; padding: 0 6px;
    border: 2px solid var(--gold-3);
  }

  /* Titular */
  .headline { display: flex; flex-direction: column; align-items: center; }
  .kicker {
    font-family: "Anton", sans-serif;
    font-size: clamp(20px, 3.8svh, 32px); letter-spacing: 1px;
    color: #f1f1f1; text-shadow: 0 3px 8px rgba(0,0,0,.8);
  }
  .big {
    font-family: "Anton", sans-serif;
    font-size: clamp(54px, 11svh, 96px); line-height: .95;
  }
  .de { font-size: clamp(10px, 1.6svh, 13px); font-weight: 800; color: var(--gold-2); letter-spacing: 2px; }
  .brand-line {
    font-family: "Anton", sans-serif;
    font-size: clamp(24px, 4.6svh, 40px); line-height: 1;
  }

  /* Beneficios */
  .cards {
    width: 100%;
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .card {
    background: linear-gradient(180deg, rgba(40,27,8,.92), rgba(12,8,3,.92));
    border: 1.5px solid var(--gold-3);
    border-radius: 12px;
    padding: clamp(8px, 1.4svh, 12px) 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    box-shadow: inset 0 0 18px rgba(245,200,76,.08), 0 6px 18px rgba(0,0,0,.5);
    font-size: clamp(9px, 1.5svh, 12px); font-weight: 800; line-height: 1.15;
    text-transform: uppercase;
  }
  .card .ico { font-size: clamp(16px, 2.8svh, 24px); line-height: 1; }
  .card .num {
    font-family: "Anton", sans-serif; font-weight: 400;
    font-size: clamp(28px, 5.4svh, 46px); line-height: 1;
  }
  .card .hl { color: var(--gold-2); }
  .card .pill {
    background: var(--red); color: #fff;
    border-radius: 999px; padding: 2px 8px; font-size: .9em;
    box-shadow: 0 2px 6px rgba(216,31,38,.5);
  }
  .card .hours { font-family: "Anton", sans-serif; font-weight: 400; font-size: 1.45em; color: var(--gold-2); }
  .card small { font-size: .85em; color: #d9cba6; text-transform: none; font-weight: 600; }

  /* Cupos */
  .cupos {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: "Anton", sans-serif; letter-spacing: 1px;
    font-size: clamp(14px, 2.4svh, 20px); color: #1a1004;
    background: linear-gradient(180deg, var(--gold-1), var(--gold-2) 50%, var(--gold-3));
    padding: 6px 18px;
    clip-path: polygon(0 0, 100% 0, 94% 100%, 0 100%);
    border-radius: 6px 0 0 6px;
  }

  /* CTA WhatsApp */
  .cta {
    width: 100%;
    display: flex; align-items: center; justify-content: center; gap: 12px;
    padding: clamp(14px, 2.6svh, 22px) 16px;
    border-radius: 18px;
    background: linear-gradient(180deg, #35e57a, var(--wpp) 45%, var(--wpp-dark));
    color: #fff; text-decoration: none;
    font-family: "Anton", sans-serif; letter-spacing: 1px;
    font-size: clamp(20px, 3.6svh, 30px); line-height: 1.05;
    text-shadow: 0 2px 4px rgba(0,0,0,.35);
    border: 2px solid var(--gold-2);
    box-shadow: 0 0 0 4px rgba(245,200,76,.25), 0 10px 30px rgba(37,211,102,.45);
    animation: pulse 1.8s ease-in-out infinite;
    -webkit-tap-highlight-color: transparent;
  }
  .cta:active { transform: scale(.97); }
  .cta svg { width: clamp(28px, 4.6svh, 40px); height: auto; flex-shrink: 0; fill: #fff; }
  .cta .sub { display: block; font-family: "Montserrat", sans-serif; font-weight: 800; font-size: .45em; letter-spacing: .5px; opacity: .95; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); box-shadow: 0 0 0 4px rgba(245,200,76,.25), 0 10px 30px rgba(37,211,102,.45); }
    50% { transform: scale(1.03); box-shadow: 0 0 0 8px rgba(245,200,76,.12), 0 10px 40px rgba(37,211,102,.7); }
  }

  .legal { font-size: clamp(8px, 1.2svh, 10px); color: #a8997a; }

  @media (prefers-reduced-motion: reduce) {
    .cta, .glyphs span { animation: none; }
  }
  /* Pantallas muy bajas: ocultar elementos secundarios para que todo entre */
  @media (max-height: 600px) {
    .crown, .logo-777 { display: none; }
  }
</style>
</head>
