<title>Aperol Spritz in 30 Seconds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: a single 16:9 SVG film stage with transport controls underneath.
   One committed dark look: ink-blue ground, Aperol orange as the only loud colour. */
:root{
  --ink:#0d1420; --ink-2:#16202f; --cream:#f7efe2; --mute:#9ba7bb;
  --aperol:#ff6a1a; --prosecco:#f4de8e; --soda:#ffc89a; --mixed:#ff9230;
  --steel:#d7dce4; --ice:#cfeaff; --line:rgba(255,255,255,.16);
  --display:'Bricolage Grotesque','Avenir Next','Helvetica Neue',Arial,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--ink)}
body{color:var(--cream);font-family:var(--body);padding-inline:16px;padding-block:24px}
.wrap{max-width:1280px;margin-inline:auto;display:grid;gap:14px}
.stage{aspect-ratio:16/9;width:100%;border-radius:10px;overflow:hidden;background:var(--ink)}
.stage svg{display:block;width:100%;height:100%}
.d{font-family:var(--display)} .b{font-family:var(--body)} .m{font-family:var(--mono)}
.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.controls button{padding:10px 18px;border:1px solid var(--line);background:var(--ink-2);color:var(--cream);border-radius:8px;font:500 15px var(--body);cursor:pointer}
.controls button:hover{border-color:var(--aperol)}
.controls button:focus-visible,.controls input:focus-visible{outline:2px solid var(--aperol);outline-offset:2px}
.controls input[type=range]{flex:1 1 220px;min-width:0;accent-color:var(--aperol)}
.controls label{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px}
.time{font:400 14px var(--mono);font-variant-numeric:tabular-nums;color:var(--mute);min-width:84px;text-align:right}
.note{margin:0;color:var(--mute);font-size:14px;line-height:1.5;max-width:65ch}
.render body{padding:0}
.render .wrap{max-width:none;gap:0}
.render .stage{width:1280px;height:720px;border-radius:0}
.render .controls,.render .note{display:none}
</style>

<main class="wrap">
  <div class="stage"><svg id="stage" viewBox="0 0 1280 720" role="img" aria-label="Animated Aperol Spritz recipe: ice, 3 oz prosecco, 2 oz Aperol, 1 oz soda water, stir, orange slice."></svg></div>
  <div class="controls">
    <button id="play" type="button">Pause</button>
    <button id="restart" type="button">Restart</button>
    <input id="scrub" type="range" min="0" max="300" step="1" value="0" aria-label="Timeline">
    <span class="time" id="time">0:00 / 0:30</span>
    <label for="loop"><input id="loop" type="checkbox" checked> Loop</label>
  </div>
  <p class="note">Classic 3 : 2 : 1 Aperol Spritz. Space plays or pauses.</p>
</main>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('stage');
const cs=getComputedStyle(document.documentElement);
const T=n=>cs.getPropertyValue('--'+n).trim();
const C={ink:T('ink'),cream:T('cream'),mute:T('mute'),aperol:T('aperol'),pro:T('prosecco'),soda:T('soda'),mixed:T('mixed'),steel:T('steel'),ice:T('ice')};
const DUR=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeOut=p=>1-Math.pow(1-p,3);
const lerp=(a,b,p)=>a+(b-a)*p;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function parse(c){if(c[0]==='#')return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16));return c.match(/\d+/g).slice(0,3).map(Number)}
function mix(a,b,p){const A=parse(a),B=parse(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],p))).join(',')+')'}
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||svg).appendChild(e);return e}
function txt(parent,s,attrs){const e=el('text',attrs,parent);e.textContent=s;return e}

/* ---------- geometry ---------- */
const GX=640, BOT=402, TOPFULL=200;
const yTop=f=>BOT-(BOT-TOPFULL)*f;
const hw=y=>y<=262?140:Math.sqrt(Math.max(0,19600-(y-262)*(y-262)));
const BOWL='M500,150 L500,262 A140,140 0 0 0 780,262 L780,150 Z';

/* ---------- timeline ---------- */
const POUR=[
  {name:'Prosecco',sub:'3 parts · 90 ml',vol:3,s:7.5,e:12.5,body:'#23513a',foil:'#d9b35b',label:'#f4ead6',ltxt:'#23513a',cap:'PROSECCO',col:C.pro},
  {name:'Aperol',sub:'2 parts · 60 ml',vol:2,s:12.5,e:17.5,body:'#ff5b12',foil:'#ff5b12',label:'#ffffff',ltxt:'#ff5b12',cap:'APEROL',col:C.aperol},
  {name:'Soda water',sub:'1 part · 30 ml',vol:1,s:17.5,e:21.5,body:'#6cb8d9',foil:'#d7dce4',label:'#ffffff',ltxt:'#2b6e8c',cap:'SODA',col:C.soda}
];
POUR.forEach(p=>{p.ps=p.s+.9;p.pe=p.e-.8});
const STEPS=[3,7.5,12.5,17.5,21.5,25,27.5];
const CAPS=[
  {a:0,b:3,l:'THE RECIPE',t:'Five ingredients. One glass.',s:'Ice · prosecco · Aperol · soda water · an orange'},
  {a:3,b:7.5,l:'STEP 1 OF 6',t:'Fill the glass with ice',s:'Large cubes, packed to the rim'},
  {a:7.5,b:12.5,l:'STEP 2 OF 6',t:'Pour in the prosecco',s:'3 oz · 90 ml · well chilled'},
  {a:12.5,b:17.5,l:'STEP 3 OF 6',t:'Add the Aperol',s:'2 oz · 60 ml · pour over the ice'},
  {a:17.5,b:21.5,l:'STEP 4 OF 6',t:'Top with soda water',s:'1 oz · 30 ml · keeps it light'},
  {a:21.5,b:25,l:'STEP 5 OF 6',t:'Stir gently',s:'One slow turn to blend, keeping the bubbles'},
  {a:25,b:27.5,l:'STEP 6 OF 6',t:'Garnish with orange',s:'A slice on the rim'},
  {a:27.5,b:30.01,l:'READY',t:'Aperol Spritz',s:'3 : 2 : 1 · serve straight away'}
];
const ICE=[[612,368,-8],[668,370,9],[640,330,14],[588,322,-6],[696,324,-12],[614,278,8],[672,276,-10],[640,236,16],[592,246,-14],[694,242,12],[648,192,-8],[598,204,20]];
const ICE_T0=3.4, ICE_GAP=.26;

/* ---------- scene ---------- */
svg.innerHTML='<defs><clipPath id="bowlClip"><path d="'+BOWL+'"/></clipPath>'+
 '<radialGradient id="glow"><stop id="gA" offset="0" stop-color="#33507a" stop-opacity=".55"/><stop id="gB" offset="1" stop-color="#33507a" stop-opacity="0"/></radialGradient></defs>';
el('rect',{width:1280,height:720,fill:C.ink});
el('circle',{cx:GX,cy:340,r:430,fill:'url(#glow)'});
const gAmb=el('g',{});
const amb=[];for(let i=0;i<16;i++){amb.push({c:el('circle',{r:2+rnd(i+3)*4,fill:'#fff'},gAmb),x:rnd(i+1)*1280,sp:.015+rnd(i+9)*.025,off:rnd(i+20)})}

/* header / title */
const gH=el('g',{});
const hK=txt(gH,'APERITIVO  ·  SERVES 1',{class:'m',x:0,y:-26,'font-size':17,'letter-spacing':4,fill:C.mute});
const hT1=txt(gH,'Aperol',{class:'d','font-weight':800,x:-4,y:100,'font-size':112,fill:C.cream,'letter-spacing':-3});
const hT2=txt(gH,'Spritz',{class:'d','font-weight':800,x:-4,y:210,'font-size':112,fill:C.aperol,'letter-spacing':-3});
const hS=txt(gH,'A 30-second recipe',{class:'b',x:0,y:262,'font-size':26,fill:C.mute});

/* ingredient list */
const ROWS=[
  {name:'Ice',sub:'Large cubes, to the rim',amt:'1 cup',color:C.ice,s:3,e:7.5},
  {name:'Prosecco',sub:POUR[0].sub,vol:3,color:C.pro,s:7.5,e:12.5,li:0},
  {name:'Aperol',sub:POUR[1].sub,vol:2,color:C.aperol,s:12.5,e:17.5,li:1},
  {name:'Soda water',sub:POUR[2].sub,vol:1,color:C.soda,s:17.5,e:21.5,li:2},
  {name:'Orange',sub:'One slice, on the rim',amt:'1 slice',color:'#ffa927',s:25,e:27.5}
];
const gList=el('g',{});
ROWS.forEach((r,i)=>{
  const yc=250+i*80;
  const g=el('g',{},gList);
  r.hl=el('rect',{x:56,y:yc-33,width:378,height:66,rx:14,fill:'rgba(255,255,255,.08)',stroke:'rgba(255,255,255,.28)','stroke-width':1.5},g);
  el('circle',{cx:94,cy:yc,r:15,fill:r.color},g);
  r.chk=el('path',{d:'M-6,0 L-2,5 L7,-5',transform:'translate(94,'+yc+')',fill:'none',stroke:C.ink,'stroke-width':3.2,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  txt(g,r.name,{class:'d','font-weight':500,x:124,y:yc-2,'font-size':25,fill:C.cream});
  txt(g,r.sub,{class:'b',x:124,y:yc+20,'font-size':15,fill:C.mute});
  r.amtEl=txt(g,'',{class:'m',x:418,y:yc+9,'font-size':30,'text-anchor':'end',fill:C.cream});
  r.g=g;
});

/* ratio chip */
const gChip=el('g',{});
txt(gChip,'3 : 2 : 1',{class:'m',x:1214,y:560,'font-size':44,'text-anchor':'end',fill:C.aperol});
txt(gChip,'PROSECCO · APEROL · SODA',{class:'m',x:1214,y:588,'font-size':13,'letter-spacing':2,'text-anchor':'end',fill:C.mute});

/* glass */
const gGl=el('g',{});
el('ellipse',{cx:GX,cy:556,rx:132,ry:9,fill:'rgba(0,0,0,.35)'},gGl);
el('path',{d:'M628,396 L652,396 C650,440 648,480 654,522 L626,522 C632,480 630,440 628,396 Z',fill:'rgba(255,255,255,.12)',stroke:'rgba(255,255,255,.4)','stroke-width':2},gGl);
el('ellipse',{cx:GX,cy:536,rx:102,ry:16,fill:'rgba(255,255,255,.13)',stroke:'rgba(255,255,255,.4)','stroke-width':2},gGl);
el('ellipse',{cx:GX,cy:534,rx:70,ry:9,fill:'none',stroke:'rgba(255,255,255,.18)','stroke-width':2},gGl);
el('path',{d:BOWL,fill:'rgba(255,255,255,.05)'},gGl);

const gLiq=el('g',{'clip-path':'url(#bowlClip)'},gGl);
const lay3=el('rect',{x:490,width:300,fill:C.soda},gLiq);
const lay2=el('rect',{x:490,width:300,fill:C.aperol},gLiq);
const lay1=el('rect',{x:490,width:300,fill:C.pro},gLiq);
const surf=el('ellipse',{cx:GX,rx:210,ry:10,fill:'rgba(255,255,255,.22)'},gLiq);
const swirl1=el('ellipse',{cx:GX,cy:330,rx:80,ry:20,fill:'none',stroke:'rgba(255,255,255,.4)','stroke-width':3,'stroke-dasharray':'40 70','stroke-linecap':'round'},gLiq);
const swirl2=el('ellipse',{cx:GX,cy:345,rx:48,ry:12,fill:'none',stroke:'rgba(255,255,255,.35)','stroke-width':3,'stroke-dasharray':'30 50','stroke-linecap':'round'},gLiq);
const bub=[];for(let i=0;i<24;i++){bub.push({c:el('circle',{fill:'rgba(255,255,255,.55)'},gLiq),u:rnd(i+40)*2-1,sp:.12+rnd(i+60)*.18,off:rnd(i+80),r:1.5+rnd(i+100)*3})}
const rip=[el('ellipse',{fill:'none',stroke:'rgba(255,255,255,.7)','stroke-width':2},gLiq),el('ellipse',{fill:'none',stroke:'rgba(255,255,255,.7)','stroke-width':2},gLiq)];

const strBase=el('line',{'stroke-width':8,'stroke-linecap':'round'},gGl);
const strHi=el('line',{stroke:'rgba(255,255,255,.55)','stroke-width':3,'stroke-dasharray':'10 18','stroke-linecap':'round'},gGl);

const gIce=el('g',{},gGl);
const cubes=ICE.map(c=>{const g=el('g',{},gIce);
  el('rect',{x:-23,y:-23,width:46,height:46,rx:9,fill:'rgba(215,240,255,.2)',stroke:'rgba(255,255,255,.6)','stroke-width':1.6},g);
  el('path',{d:'M-15,-9 L-15,-15 L-9,-15',fill:'none',stroke:'rgba(255,255,255,.7)','stroke-width':2.4,'stroke-linecap':'round'},g);
  el('rect',{x:-10,y:-3,width:20,height:16,rx:5,fill:'rgba(255,255,255,.08)'},g);
  return g});

const gSp=el('g',{});
el('line',{x1:70,y1:-330,x2:0,y2:0,stroke:C.steel,'stroke-width':6,'stroke-linecap':'round'},gSp);
el('ellipse',{cx:0,cy:0,rx:11,ry:6,fill:C.steel},gSp);
gGl.appendChild(gSp);

el('path',{d:BOWL,fill:'none',stroke:'rgba(255,255,255,.5)','stroke-width':2.5,'stroke-linejoin':'round'},gGl);
el('ellipse',{cx:GX,cy:150,rx:140,ry:14,fill:'none',stroke:'rgba(255,255,255,.5)','stroke-width':2.5},gGl);
el('path',{d:'M516,190 L516,262 C520,310 546,350 590,380',fill:'none',stroke:'rgba(255,255,255,.5)','stroke-width':6,'stroke-linecap':'round'},gGl);
el('path',{d:'M764,200 L764,236',fill:'none',stroke:'rgba(255,255,255,.35)','stroke-width':5,'stroke-linecap':'round'},gGl);

/* garnish */
const gO=el('g',{});
el('circle',{r:44,fill:'#f08a0a'},gO);el('circle',{r:39,fill:'#fff0cc'},gO);el('circle',{r:36,fill:'#ffa927'},gO);
for(let i=0;i<8;i++){const a=i*Math.PI/4;el('line',{x1:0,y1:0,x2:Math.cos(a)*36,y2:Math.sin(a)*36,stroke:'#ffd9a0','stroke-width':2.5},gO)}
el('circle',{r:4,fill:'#ffd9a0'},gO);
el('path',{d:'M-24,-14 A28,28 0 0 1 -6,-28',fill:'none',stroke:'rgba(255,255,255,.55)','stroke-width':3,'stroke-linecap':'round'},gO);
const spk=[];for(let i=0;i<7;i++)spk.push(el('line',{stroke:C.cream,'stroke-width':3,'stroke-linecap':'round'}));

/* layer tags */
const tags=POUR.map((p,i)=>{const g=el('g',{});
  const ln=el('line',{stroke:'rgba(255,255,255,.4)','stroke-width':1.5},g);
  const nm=txt(g,p.name.toUpperCase(),{class:'m',x:818,'font-size':13,'letter-spacing':2.5,fill:p.col});
  const am=txt(g,'',{class:'m',x:948,'font-size':24,fill:C.cream});
  const ml=el('tspan',{class:'b','font-size':15,fill:C.mute},am);
  return {g,ln,nm,am,ml}});

/* bottle */
const gB=el('g',{});
const gBr=el('g',{},gB);
const bFoil=el('rect',{x:-10,y:5,width:20,height:48},gBr);
const bBody=el('path',{d:'M-9,5 L9,5 L9,62 C9,82 34,92 34,124 L34,300 Q34,314 20,314 L-20,314 Q-34,314 -34,300 L-34,124 C-34,92 -9,82 -9,62 Z'},gBr);
const bFoil2=el('rect',{x:-10,y:-3,width:20,height:58,rx:3},gBr);
const bLabel=el('rect',{x:-34,y:150,width:68,height:116},gBr);
const bTxt=txt(gBr,'',{class:'d','font-weight':800,'font-size':15,'text-anchor':'middle','dominant-baseline':'central','letter-spacing':1.5,transform:'translate(0,208) rotate(90)'});
el('path',{d:'M-24,130 L-24,290',stroke:'rgba(255,255,255,.28)','stroke-width':5,'stroke-linecap':'round',fill:'none'},gBr);

/* finale */
const gF=el('g',{});
txt(gF,'Salute!',{class:'d','font-weight':800,x:850,y:330,'font-size':112,fill:C.aperol,'letter-spacing':-3});
txt(gF,'Serve straight away, over ice.',{class:'b',x:854,y:380,'font-size':26,fill:C.cream});
const star=el('g',{});
const stars=[[470,130],[830,170],[478,300],[826,336],[560,92],[742,96],[884,250],[440,214]].map((p,i)=>{
  return el('path',{d:'M0,-14 L3,-3 L14,0 L3,3 L0,14 L-3,3 L-14,0 L-3,-3 Z',fill:C.cream,transform:'translate('+p[0]+','+p[1]+') scale(0)'},star)});

/* captions */
const caps=CAPS.map(c=>{const g=el('g',{});
  txt(g,c.l,{class:'m',x:640,y:624,'font-size':14,'letter-spacing':4,'text-anchor':'middle',fill:C.aperol});
  txt(g,c.t,{class:'d','font-weight':800,x:640,y:664,'font-size':40,'text-anchor':'middle',fill:C.cream,'letter-spacing':-.5});
  txt(g,c.s,{class:'b',x:640,y:694,'font-size':19,'text-anchor':'middle',fill:C.mute});
  return g});

/* progress */
el('rect',{x:0,y:714,width:1280,height:6,fill:'rgba(255,255,255,.08)'});
const prog=el('rect',{x:0,y:714,width:0,height:6,fill:C.aperol});
STEPS.forEach(s=>el('rect',{x:s/DUR*1280-1,y:714,width:2,height:6,fill:C.ink}));

/* ---------- render ---------- */
function render(t){
  const p=POUR.map(o=>seg(t,o.ps,o.pe));
  const L=.5*p[0]+(1/3)*p[1]+(1/6)*p[2];
  const tops=[.5*p[0],.5+(1/3)*p[1],5/6+(1/6)*p[2]];
  const m=ease(seg(t,22.0,24.3));
  const base=[C.pro,C.aperol,C.soda];
  const col=base.map(b=>mix(b,C.mixed,m));
  const stirW=ease(seg(t,21.5,22.1))*(1-ease(seg(t,24.5,25)));

  /* glow */
  let gc='#33507a';
  POUR.forEach((o,i)=>{if(t>o.ps)gc=mix(gc,col[i],seg(t,o.ps,o.ps+.8))});
  document.getElementById('gA').setAttribute('stop-color',gc);
  document.getElementById('gB').setAttribute('stop-color',gc);

  /* ambient */
  amb.forEach(a=>{const ph=(t*a.sp+a.off)%1;a.c.setAttribute('cx',a.x);a.c.setAttribute('cy',730-ph*760);a.c.setAttribute('opacity',(.05+.08*Math.sin(ph*Math.PI)).toFixed(3))});

  /* header */
  const he=ease(seg(t,2.3,3.1));
  const hs=lerp(1,.4,he), hty=lerp(196,40,he);
  gH.setAttribute('transform','translate(70,'+hty+') scale('+hs+')');
  hK.setAttribute('opacity',1-seg(t,2.2,2.7));
  hS.setAttribute('opacity',seg(t,1.0,1.7)*(1-seg(t,2.2,2.7)));

  /* list */
  ROWS.forEach((r,i)=>{
    const a0=seg(t,2.9+i*.12,3.4+i*.12);
    const pre=t<r.s, done=t>=r.e;
    r.g.setAttribute('opacity',(a0*(pre?.42:done?.82:1)).toFixed(3));
    r.hl.setAttribute('opacity',(seg(t,r.s,r.s+.3)*(1-seg(t,r.e-.05,r.e+.3))).toFixed(3));
    r.chk.setAttribute('opacity',seg(t,r.e,r.e+.3).toFixed(3));
    if(r.li!==undefined){
      const o=POUR[r.li];const act=t>=o.ps&&t<o.pe;
      r.amtEl.textContent=(act?(o.vol*p[r.li]).toFixed(1):o.vol)+' oz';
    }else r.amtEl.textContent=r.amt;
  });
  gChip.setAttribute('opacity',seg(t,3.2,3.8));

  /* glass */
  const go=26*(1-easeOut(seg(t,0,1)));
  gGl.setAttribute('transform','translate(0,'+go.toFixed(2)+')');

  const ys=[yTop(tops[0]),yTop(tops[1]),yTop(tops[2])];
  [[lay1,0,ys[0],col[0]],[lay2,1,ys[1],col[1]],[lay3,2,ys[2],col[2]]].forEach(([r,i,y,c])=>{
    r.setAttribute('visibility',p[i]>0?'visible':'hidden');
    r.setAttribute('y',y);r.setAttribute('height',BOT+10-y);r.setAttribute('fill',c);
  });
  const sy=yTop(L);
  surf.setAttribute('visibility',L>0?'visible':'hidden');surf.setAttribute('cy',sy);

  /* bubbles */
  bub.forEach(b=>{
    if(L<=0){b.c.setAttribute('visibility','hidden');return}
    const ph=(t*b.sp+b.off)%1;const y=396-ph*(396-sy);
    if(y<sy+5||y>396){b.c.setAttribute('visibility','hidden');return}
    b.c.setAttribute('visibility','visible');
    b.c.setAttribute('cx',GX+b.u*Math.max(0,hw(y)-12));b.c.setAttribute('cy',y);b.c.setAttribute('r',b.r);
  });

  /* ice */
  ICE.forEach((c,i)=>{
    const s=ICE_T0+i*ICE_GAP, g=cubes[i];
    if(t<s){g.setAttribute('visibility','hidden');return}
    g.setAttribute('visibility','visible');
    const pp=seg(t,s,s+.55);
    let off=-(c[1]+150)*(1-pp*pp);
    if(pp>=1){const b=seg(t,s+.55,s+.85);off-=12*Math.sin(Math.PI*b)*(1-b)}
    const rot=c[2]+(1-pp)*80*(i%2?1:-1);
    const a=t*Math.PI*2*.75+(21.9*Math.PI*2*.75)*0;
    const ang=(t-21.9)*Math.PI*2*.75;
    const dx=7*stirW*Math.cos(ang+i), dy=4*stirW*Math.sin(ang+i*1.3);
    g.setAttribute('transform','translate('+(c[0]+dx).toFixed(1)+','+(c[1]+off-16*L+dy).toFixed(1)+') rotate('+(rot+stirW*6*Math.sin(ang+i)).toFixed(1)+')');
  });

  /* swirl */
  swirl1.setAttribute('opacity',(.6*stirW).toFixed(3));swirl2.setAttribute('opacity',(.6*stirW).toFixed(3));
  swirl1.setAttribute('stroke-dashoffset',(-t*160).toFixed(1));swirl2.setAttribute('stroke-dashoffset',(t*140).toFixed(1));

  /* spoon */
  const ang2=(t-21.9)*Math.PI*2*.75;
  const spIn=ease(seg(t,21.5,22.1)),spOut=ease(seg(t,24.5,25.0));
  const spv=spIn-spOut;
  gSp.setAttribute('visibility',spv>0?'visible':'hidden');
  gSp.setAttribute('transform','translate('+(GX+Math.cos(ang2)*34).toFixed(1)+','+(332+Math.sin(ang2)*9-(1-spv)*460).toFixed(1)+')');

  /* bottle + stream */
  let bk=-1;POUR.forEach((o,i)=>{if(t>=o.s&&t<o.e)bk=i});
  let strOn=false;
  if(bk<0){gB.setAttribute('visibility','hidden')}
  else{
    const o=POUR[bk];
    const u=ease(seg(t,o.s,o.s+.9))-ease(seg(t,o.pe,o.e));
    gB.setAttribute('visibility','visible');
    const wob=(t>=o.ps&&t<o.pe)?Math.sin(t*18)*.8:0;
    const px=lerp(1420,668,u), py=lerp(330,132,u)+wob, ang=-105*u;
    gB.setAttribute('transform','translate('+px.toFixed(1)+','+py.toFixed(1)+') rotate('+ang.toFixed(1)+')');
    bBody.setAttribute('fill',o.body);bFoil.setAttribute('fill',o.foil);bFoil2.setAttribute('fill',o.foil);
    bLabel.setAttribute('fill',o.label);bTxt.setAttribute('fill',o.ltxt);bTxt.textContent=o.cap;
    if(t>=o.ps&&t<o.pe){
      strOn=true;
      const sx=px-4, y0=py+2, y1=yTop(L);
      const a=seg(t,o.ps,o.ps+.2), b=seg(t,o.pe-.2,o.pe);
      const ya=lerp(y0,y1,b), yb=lerp(y0,y1,a);
      [strBase,strHi].forEach(s=>{s.setAttribute('x1',sx);s.setAttribute('x2',sx);s.setAttribute('y1',ya);s.setAttribute('y2',yb)});
      strBase.setAttribute('stroke',o.col);
      strHi.setAttribute('stroke-dashoffset',(-t*160).toFixed(1));
      rip.forEach((r,j)=>{const ph=((t-o.ps)*1.6+j*.5)%1;const rx=6+ph*40;
        r.setAttribute('cx',sx);r.setAttribute('cy',y1);r.setAttribute('rx',rx);r.setAttribute('ry',rx*.22);r.setAttribute('opacity',((1-ph)*.7*a*(1-b)).toFixed(3));r.setAttribute('visibility','visible')});
    }
  }
  strBase.setAttribute('visibility',strOn?'visible':'hidden');strHi.setAttribute('visibility',strOn?'visible':'hidden');
  if(!strOn)rip.forEach(r=>r.setAttribute('visibility','hidden'));

  /* tags */
  const tagVis=1-seg(t,21.4,21.9);
  tags.forEach((tg,i)=>{
    const o=POUR[i];
    const lo=i===0?BOT:ys[i-1], hi=ys[i];
    const mid=(lo+hi)/2;
    const a=p[i]>0?seg(t,o.ps,o.ps+.4)*tagVis:0;
    tg.g.setAttribute('opacity',a.toFixed(3));
    const act=t>=o.ps&&t<o.pe;
    const v=act?(o.vol*p[i]).toFixed(1):String(o.vol);
    tg.am.firstChild.nodeValue=v+' oz ';
    tg.ml.textContent=Math.round(o.vol*30)+' ml';
    tg.nm.setAttribute('y',(mid+5).toFixed(1));tg.am.setAttribute('y',(mid+8).toFixed(1));
    const x0=GX+hw(mid)+12;
    tg.ln.setAttribute('x1',x0);tg.ln.setAttribute('x2',808);tg.ln.setAttribute('y1',mid);tg.ln.setAttribute('y2',mid);
  });

  /* garnish */
  const gp=seg(t,25.0,25.8);
  if(t<25){gO.setAttribute('visibility','hidden')}
  else{
    gO.setAttribute('visibility','visible');
    let gy=lerp(-80,152,gp*gp);
    if(gp>=1){const b=seg(t,25.8,26.25);gy-=12*Math.sin(Math.PI*b)*(1-b)}
    const gx=lerp(930,772,easeOut(gp)), gr=lerp(220,14,easeOut(gp));
    gO.setAttribute('transform','translate('+gx.toFixed(1)+','+(gy+go).toFixed(1)+') rotate('+gr.toFixed(1)+')');
  }
  const sk=seg(t,25.8,26.5);
  spk.forEach((s,i)=>{
    const a=-Math.PI*.9+i*(Math.PI*.8/6);
    const r0=52+sk*8,r1=52+sk*30;
    s.setAttribute('x1',772+Math.cos(a)*r0);s.setAttribute('y1',152+go+Math.sin(a)*r0);
    s.setAttribute('x2',772+Math.cos(a)*r1);s.setAttribute('y2',152+go+Math.sin(a)*r1);
    s.setAttribute('opacity',(sk>0&&sk<1?1-sk:0).toFixed(3));
  });

  /* finale */
  const fe=ease(seg(t,27.6,28.3));
  gF.setAttribute('opacity',fe.toFixed(3));
  gF.setAttribute('transform','translate(0,'+((1-fe)*30).toFixed(1)+')');
  stars.forEach((s,i)=>{
    const sc=Math.max(0,Math.sin((t-27.8)*4+i*1.7))*fe;
    const p0=[470,130,830,170,478,300,826,336,560,92,742,96,884,250,440,214];
    s.setAttribute('transform','translate('+p0[i*2]+','+p0[i*2+1]+') scale('+(sc*.9).toFixed(3)+')');
  });

  /* captions */
  CAPS.forEach((c,i)=>{
    const a=seg(t,c.a,c.a+.35), b=1-seg(t,c.b-.3,c.b);
    caps[i].setAttribute('opacity',(a*b).toFixed(3));
    caps[i].setAttribute('transform','translate(0,'+((1-ease(a))*18).toFixed(1)+')');
  });

  prog.setAttribute('width',(t/DUR*1280).toFixed(1));
}

/* ---------- playback ---------- */
const playBtn=document.getElementById('play'),restartBtn=document.getElementById('restart'),scrub=document.getElementById('scrub'),timeEl=document.getElementById('time'),loopEl=document.getElementById('loop');
const RENDER=location.hash==='#render';
if(RENDER)document.documentElement.classList.add('render');
const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=0,playing=!REDUCED&&!RENDER,last=null;
const fmt=s=>'0:'+String(Math.floor(s)).padStart(2,'0');
function paint(){render(t);scrub.value=Math.round(t*10);timeEl.textContent=fmt(t)+' / 0:30'}
function sync(){playBtn.textContent=playing?'Pause':'Play'}
function frame(ts){
  if(last===null)last=ts;const dt=Math.min(.1,(ts-last)/1000);last=ts;
  if(playing){t+=dt;if(t>=DUR){if(loopEl.checked)t=t%DUR;else{t=DUR;playing=false;sync()}}}
  paint();requestAnimationFrame(frame);
}
playBtn.addEventListener('click',()=>{if(!playing&&t>=DUR)t=0;playing=!playing;sync()});
restartBtn.addEventListener('click',()=>{t=0;playing=true;sync()});
scrub.addEventListener('input',()=>{t=scrub.value/10;paint()});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playBtn.click()}});
window.__film={render:x=>{t=x;render(x)},fontsReady:()=>document.fonts.ready};
sync();paint();
if(!RENDER)requestAnimationFrame(frame);
})();
</script>
