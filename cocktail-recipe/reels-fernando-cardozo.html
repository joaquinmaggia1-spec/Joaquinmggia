<meta charset="utf-8">
<title>Reel Lic. Fernando Cardozo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: 9:16 Reels stage (1080x1920). Safe zones: keep content between y=230 and y=1585.
   Look: deep green ink, cream type, coral-berry accent. */
:root{
  --ink:#0c1a16; --ink-2:#15291f; --cream:#f6f1e7; --mute:#a3b9ae;
  --accent:#ff6b81; --yogur:#f6ecdd; --berry:#c9234f; --agua:#bfe3f0; --mixed:#e8708f;
  --steel:#d7dce4; --ice:#cfeaff; --line:rgba(255,255,255,.18);
  --display:'Bricolage Grotesque','Avenir Next','Helvetica Neue',Arial,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{background:var(--ink)}
body{color:var(--cream);font-family:var(--body);padding-inline:16px;padding-block:24px}
.wrap{max-width:460px;margin-inline:auto;display:grid;gap:14px}
.stage{aspect-ratio:9/16;width:100%;border-radius:14px;overflow:hidden;background:var(--ink)}
.stage svg{display:block;width:100%;height:100%}
.d{font-family:var(--display)} .b{font-family:var(--body)} .m{font-family:var(--mono)}
.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.controls button{padding:10px 16px;border:1px solid var(--line);background:var(--ink-2);color:var(--cream);border-radius:8px;font:500 15px var(--body);cursor:pointer}
.controls button:hover{border-color:var(--accent)}
.controls button:focus-visible,.controls input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls input[type=range]{flex:1 1 140px;min-width:0;accent-color:var(--accent)}
.controls label{display:flex;gap:6px;align-items:center;color:var(--mute);font-size:14px}
.time{font:400 14px var(--mono);font-variant-numeric:tabular-nums;color:var(--mute);min-width:84px;text-align:right}
.note{margin:0;color:var(--mute);font-size:14px;line-height:1.5}
.render body{padding:0}
.render .wrap{max-width:none;gap:0}
.render .stage{width:1080px;height:1920px;border-radius:0}
.render .controls,.render .note{display:none}
</style>

<main class="wrap">
  <div class="stage"><svg id="stage" viewBox="0 0 1080 1920" role="img" aria-label="Reel animado del Lic. Fernando Cardozo, nutricionista: smoothie de frutos rojos paso a paso."></svg></div>
  <div class="controls">
    <button id="play" type="button">Pausar</button>
    <button id="restart" type="button">Reiniciar</button>
    <input id="scrub" type="range" min="0" max="300" step="1" value="0" aria-label="Línea de tiempo">
    <span class="time" id="time">0:00 / 0:30</span>
    <label for="loop"><input id="loop" type="checkbox" checked> Repetir</label>
  </div>
  <p class="note">Formato Reels 9:16. Barra espaciadora para pausar o reanudar.</p>
</main>

<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('stage');
const cs=getComputedStyle(document.documentElement);
const T=n=>cs.getPropertyValue('--'+n).trim();
const C={ink:T('ink'),cream:T('cream'),mute:T('mute'),acc:T('accent'),yog:T('yogur'),ber:T('berry'),agua:T('agua'),mixed:T('mixed'),steel:T('steel'),ice:T('ice')};
const DUR=30;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const seg=(t,a,b)=>clamp((t-a)/(b-a));
const ease=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
const easeOut=p=>1-Math.pow(1-p,3);
const lerp=(a,b,p)=>a+(b-a)*p;
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function parse(c){if(c[0]==='#')return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16));return c.match(/\d+/g).slice(0,3).map(Number)}
function mix(a,b,p){const A=parse(a),B=parse(b);return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],p))).join(',')+')'}
let cur=svg;
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);(parent||cur).appendChild(e);return e}
function txt(parent,s,attrs){const e=el('text',attrs,parent);e.textContent=s;return e}

/* ---------- scene geometry (glass local space, scaled into the reel) ---------- */
const GX=640, BOT=402, TOPFULL=200;
const SC=1.3, SX=450-640*SC, SY=640-150*SC;
const yTop=f=>BOT-(BOT-TOPFULL)*f;
const hw=y=>y<=262?140:Math.sqrt(Math.max(0,19600-(y-262)*(y-262)));
const BOWL='M500,150 L500,262 A140,140 0 0 0 780,262 L780,150 Z';

/* ---------- timeline ---------- */
const POUR=[
  {name:'Yogur',vol:150,s:7.5,e:12.5,body:'#f4ede2',foil:'#6cae75',label:'#ffffff',ltxt:'#3d6b45',cap:'YOGUR',col:C.yog},
  {name:'Frutos',vol:100,s:12.5,e:17.5,body:'#b3173f',foil:'#7a0f2b',label:'#ffffff',ltxt:'#b3173f',cap:'FRUTOS',col:'#ff9db0'},
  {name:'Agua',vol:50,s:17.5,e:21.5,body:'#6cb8d9',foil:'#d7dce4',label:'#ffffff',ltxt:'#2b6e8c',cap:'AGUA',col:C.agua}
];
POUR.forEach(p=>{p.ps=p.s+.9;p.pe=p.e-.8});
const CAPS=[
  {a:0,b:3,l:'LA RECETA',t:'Cinco ingredientes. Un vaso.',s:'Hielo · yogur · frutos rojos · agua · frutilla'},
  {a:3,b:7.5,l:'PASO 1 DE 6',t:'Llená el vaso con hielo',s:'Cubos grandes, hasta el borde'},
  {a:7.5,b:12.5,l:'PASO 2 DE 6',t:'Sumá el yogur natural',s:'150 ml · bien frío'},
  {a:12.5,b:17.5,l:'PASO 3 DE 6',t:'Agregá los frutos rojos',s:'100 ml · frescos o descongelados'},
  {a:17.5,b:21.5,l:'PASO 4 DE 6',t:'Completá con agua fría',s:'50 ml · para aligerar'},
  {a:21.5,b:25,l:'PASO 5 DE 6',t:'Mezclá suave',s:'Una vuelta lenta para integrar todo'},
  {a:25,b:27.5,l:'PASO 6 DE 6',t:'Decorá con una frutilla',s:'Sobre el borde del vaso'},
  {a:27.5,b:30.01,l:'LISTO',t:'Smoothie de frutos rojos',s:'3 : 2 : 1 · tomalo al momento'}
];
const ICE=[[612,368,-8],[668,370,9],[640,330,14],[588,322,-6],[696,324,-12],[614,278,8],[672,276,-10],[640,236,16],[592,246,-14],[694,242,12],[648,192,-8],[598,204,20]];
const ICE_T0=3.4, ICE_GAP=.26;

/* ---------- static scene ---------- */
svg.innerHTML='<defs><clipPath id="bowlClip"><path d="'+BOWL+'"/></clipPath>'+
 '<radialGradient id="glow"><stop id="gA" offset="0" stop-color="#2f6b57" stop-opacity=".55"/><stop id="gB" offset="1" stop-color="#2f6b57" stop-opacity="0"/></radialGradient></defs>';
el('rect',{width:1080,height:1920,fill:C.ink});
el('circle',{cx:520,cy:900,r:680,fill:'url(#glow)'});
const gAmb=el('g',{});
const amb=[];for(let i=0;i<22;i++){amb.push({c:el('circle',{r:3+rnd(i+3)*6,fill:'#fff'},gAmb),x:rnd(i+1)*1080,sp:.012+rnd(i+9)*.02,off:rnd(i+20)})}

/* brand header */
const gH=el('g',{});
const hK=txt(gH,'NUTRICIÓN  ·  RECETAS',{class:'m',x:0,y:-34,'font-size':24,'letter-spacing':5,fill:C.mute});
txt(gH,'Lic. Fernando',{class:'d','font-weight':800,x:-4,y:100,'font-size':108,fill:C.cream,'letter-spacing':-3});
txt(gH,'Cardozo',{class:'d','font-weight':800,x:-4,y:210,'font-size':108,fill:C.acc,'letter-spacing':-3});
txt(gH,'NUTRICIONISTA',{class:'m',x:0,y:272,'font-size':40,'letter-spacing':9,fill:C.cream});
const hS=txt(gH,'Receta: smoothie de frutos rojos',{class:'b',x:0,y:340,'font-size':38,fill:C.mute});

/* ingredient cards */
const CARDS=[
  {name:'Hielo',amt:'1 taza',color:C.ice,s:3,e:7.5,x:70,y:1215},
  {name:'Yogur natural',vol:150,color:C.yog,s:7.5,e:12.5,li:0,x:390,y:1215},
  {name:'Frutos rojos',vol:100,color:C.ber,s:12.5,e:17.5,li:1,x:710,y:1215},
  {name:'Agua fría',vol:50,color:C.agua,s:17.5,e:21.5,li:2,x:70,y:1345},
  {name:'Frutilla',amt:'1 unidad',color:'#e63a56',s:25,e:27.5,x:390,y:1345}
];
const gList=el('g',{});
CARDS.forEach(r=>{
  const g=el('g',{},gList);
  el('rect',{x:r.x,y:r.y,width:300,height:110,rx:20,fill:'rgba(255,255,255,.05)',stroke:'rgba(255,255,255,.14)','stroke-width':2},g);
  r.hl=el('rect',{x:r.x,y:r.y,width:300,height:110,rx:20,fill:'rgba(255,255,255,.1)',stroke:'rgba(255,255,255,.55)','stroke-width':2.5},g);
  el('circle',{cx:r.x+36,cy:r.y+55,r:19,fill:r.color},g);
  r.chk=el('path',{d:'M-8,0 L-3,7 L9,-7',transform:'translate('+(r.x+36)+','+(r.y+55)+')',fill:'none',stroke:C.ink,'stroke-width':4.5,'stroke-linecap':'round','stroke-linejoin':'round'},g);
  txt(g,r.name,{class:'d','font-weight':500,x:r.x+68,y:r.y+50,'font-size':28,fill:C.cream});
  r.amtEl=txt(g,'',{class:'m',x:r.x+68,y:r.y+90,'font-size':30,fill:C.cream});
  r.g=g;
});
const gChip=el('g',{});
txt(gChip,'3 : 2 : 1',{class:'m',x:860,y:1405,'font-size':50,'text-anchor':'middle',fill:C.acc});
txt(gChip,'YOGUR · FRUTOS · AGUA',{class:'m',x:860,y:1436,'font-size':19,'letter-spacing':1.5,'text-anchor':'middle',fill:C.mute});

/* scene group */
const gSc=el('g',{transform:'translate('+SX+','+SY+') scale('+SC+')'});
cur=gSc;
const gGl=el('g',{});
el('ellipse',{cx:GX,cy:556,rx:132,ry:9,fill:'rgba(0,0,0,.35)'},gGl);
el('path',{d:'M628,396 L652,396 C650,440 648,480 654,522 L626,522 C632,480 630,440 628,396 Z',fill:'rgba(255,255,255,.12)',stroke:'rgba(255,255,255,.4)','stroke-width':2},gGl);
el('ellipse',{cx:GX,cy:536,rx:102,ry:16,fill:'rgba(255,255,255,.13)',stroke:'rgba(255,255,255,.4)','stroke-width':2},gGl);
el('ellipse',{cx:GX,cy:534,rx:70,ry:9,fill:'none',stroke:'rgba(255,255,255,.18)','stroke-width':2},gGl);
el('path',{d:BOWL,fill:'rgba(255,255,255,.05)'},gGl);

const gLiq=el('g',{'clip-path':'url(#bowlClip)'},gGl);
const lay3=el('rect',{x:490,width:300,fill:C.agua},gLiq);
const lay2=el('rect',{x:490,width:300,fill:C.ber},gLiq);
const lay1=el('rect',{x:490,width:300,fill:C.yog},gLiq);
const surf=el('ellipse',{cx:GX,rx:210,ry:10,fill:'rgba(255,255,255,.22)'},gLiq);
const swirl1=el('ellipse',{cx:GX,cy:330,rx:80,ry:20,fill:'none',stroke:'rgba(255,255,255,.4)','stroke-width':3,'stroke-dasharray':'40 70','stroke-linecap':'round'},gLiq);
const swirl2=el('ellipse',{cx:GX,cy:345,rx:48,ry:12,fill:'none',stroke:'rgba(255,255,255,.35)','stroke-width':3,'stroke-dasharray':'30 50','stroke-linecap':'round'},gLiq);
const bub=[];for(let i=0;i<10;i++){bub.push({c:el('circle',{fill:'rgba(255,255,255,.5)'},gLiq),u:rnd(i+40)*2-1,sp:.1+rnd(i+60)*.15,off:rnd(i+80),r:1.5+rnd(i+100)*2.5})}
const rip=[el('ellipse',{fill:'none',stroke:'rgba(255,255,255,.7)','stroke-width':2},gLiq),el('ellipse',{fill:'none',stroke:'rgba(255,255,255,.7)','stroke-width':2},gLiq)];

const strBase=el('line',{'stroke-width':8,'stroke-linecap':'round'},gGl);
const strHi=el('line',{stroke:'rgba(255,255,255,.55)','stroke-width':3,'stroke-dasharray':'10 18','stroke-linecap':'round'},gGl);

const gIce=el('g',{},gGl);
const cubes=ICE.map(c=>{const g=el('g',{},gIce);
  el('rect',{x:-23,y:-23,width:46,height:46,rx:9,fill:'rgba(215,240,255,.2)',stroke:'rgba(255,255,255,.6)','stroke-width':1.6},g);
  el('path',{d:'M-15,-9 L-15,-15 L-9,-15',fill:'none',stroke:'rgba(255,255,255,.7)','stroke-width':2.4,'stroke-linecap':'round'},g);
  el('rect',{x:-10,y:-3,width:20,height:16,rx:5,fill:'rgba(255,255,255,.08)'},g);
  return g});

const gSp=el('g',{});
el('line',{x1:70,y1:-330,x2:0,y2:0,stroke:C.steel,'stroke-width':6,'stroke-linecap':'round'},gSp);
el('ellipse',{cx:0,cy:0,rx:11,ry:6,fill:C.steel},gSp);
gGl.appendChild(gSp);

el('path',{d:BOWL,fill:'none',stroke:'rgba(255,255,255,.5)','stroke-width':2.5,'stroke-linejoin':'round'},gGl);
el('ellipse',{cx:GX,cy:150,rx:140,ry:14,fill:'none',stroke:'rgba(255,255,255,.5)','stroke-width':2.5},gGl);
el('path',{d:'M516,190 L516,262 C520,310 546,350 590,380',fill:'none',stroke:'rgba(255,255,255,.5)','stroke-width':6,'stroke-linecap':'round'},gGl);
el('path',{d:'M764,200 L764,236',fill:'none',stroke:'rgba(255,255,255,.35)','stroke-width':5,'stroke-linecap':'round'},gGl);

/* garnish: strawberry */
const gO=el('g',{});
el('path',{d:'M0,38 C-36,20 -38,-16 -20,-28 C-9,-34 0,-30 0,-25 C0,-30 9,-34 20,-28 C38,-16 36,20 0,38 Z',fill:'#e63a56'},gO);
[[-14,-8],[8,-12],[-4,6],[16,4],[-16,14],[4,22],[-6,-20],[18,-22]].forEach(p=>el('ellipse',{cx:p[0],cy:p[1],rx:2,ry:3.2,fill:'#ffe08a'},gO));
el('path',{d:'M0,-26 L-14,-38 L-5,-31 L0,-44 L5,-31 L14,-38 Z',fill:'#3fa34d'},gO);
el('path',{d:'M-24,-8 C-28,4 -22,16 -12,24',fill:'none',stroke:'rgba(255,255,255,.45)','stroke-width':3,'stroke-linecap':'round'},gO);
const spk=[];for(let i=0;i<7;i++)spk.push(el('line',{stroke:C.cream,'stroke-width':3,'stroke-linecap':'round'}));

/* layer tags */
const tags=POUR.map((p,i)=>{const g=el('g',{});
  const ln=el('line',{stroke:'rgba(255,255,255,.45)','stroke-width':1.5},g);
  const tx=el('text',{class:'m',x:820},g);
  const nm=el('tspan',{'font-size':22,'letter-spacing':2,fill:p.col},tx);nm.textContent=p.name.toUpperCase();
  const am=el('tspan',{'font-size':28,fill:C.cream,dx:14},tx);
  return {g,ln,tx,am}});

/* bottle */
const gB=el('g',{});
const gBr=el('g',{},gB);
const bFoil=el('rect',{x:-10,y:5,width:20,height:48},gBr);
const bBody=el('path',{d:'M-9,5 L9,5 L9,62 C9,82 34,92 34,124 L34,300 Q34,314 20,314 L-20,314 Q-34,314 -34,300 L-34,124 C-34,92 -9,82 -9,62 Z'},gBr);
const bFoil2=el('rect',{x:-10,y:-3,width:20,height:58,rx:3},gBr);
const bLabel=el('rect',{x:-34,y:150,width:68,height:116},gBr);
const bTxt=txt(gBr,'',{class:'d','font-weight':800,'font-size':15,'text-anchor':'middle','dominant-baseline':'central','letter-spacing':1.5,transform:'translate(0,208) rotate(90)'});
el('path',{d:'M-24,130 L-24,290',stroke:'rgba(255,255,255,.28)','stroke-width':5,'stroke-linecap':'round',fill:'none'},gBr);

const star=el('g',{});
const SP0=[[470,130],[830,170],[478,300],[826,336],[560,92],[742,96],[884,250],[440,214]];
const stars=SP0.map(p=>el('path',{d:'M0,-14 L3,-3 L14,0 L3,3 L0,14 L-3,3 L-14,0 L-3,-3 Z',fill:C.cream,transform:'translate('+p[0]+','+p[1]+') scale(0)'},star));

cur=svg;
/* finale text */
const gF=el('g',{});
txt(gF,'¡Buen provecho!',{class:'d','font-weight':800,x:70,y:500,'font-size':92,fill:C.acc,'letter-spacing':-2});
txt(gF,'Seguime para más recetas simples',{class:'b',x:74,y:556,'font-size':34,fill:C.cream});

/* captions */
const caps=CAPS.map(c=>{const g=el('g',{});
  txt(g,c.l,{class:'m',x:540,y:1496,'font-size':24,'letter-spacing':6,'text-anchor':'middle',fill:C.acc});
  txt(g,c.t,{class:'d','font-weight':800,x:540,y:1546,'font-size':56,'text-anchor':'middle',fill:C.cream,'letter-spacing':-.5});
  txt(g,c.s,{class:'b',x:540,y:1586,'font-size':30,'text-anchor':'middle',fill:C.mute});
  return g});

/* ---------- render ---------- */
function render(t){
  const p=POUR.map(o=>seg(t,o.ps,o.pe));
  const L=.5*p[0]+(1/3)*p[1]+(1/6)*p[2];
  const tops=[.5*p[0],.5+(1/3)*p[1],5/6+(1/6)*p[2]];
  const m=ease(seg(t,22.0,24.3));
  const base=[C.yog,C.ber,C.agua];
  const col=base.map(b=>mix(b,C.mixed,m));
  const stirW=ease(seg(t,21.5,22.1))*(1-ease(seg(t,24.5,25)));

  let gc='#2f6b57';
  POUR.forEach((o,i)=>{if(t>o.ps)gc=mix(gc,col[i],seg(t,o.ps,o.ps+.8))});
  document.getElementById('gA').setAttribute('stop-color',gc);
  document.getElementById('gB').setAttribute('stop-color',gc);

  amb.forEach(a=>{const ph=(t*a.sp+a.off)%1;a.c.setAttribute('cx',a.x);a.c.setAttribute('cy',1940-ph*1980);a.c.setAttribute('opacity',(.04+.07*Math.sin(ph*Math.PI)).toFixed(3))});

  /* header: big lockup -> compact top bar */
  const he=ease(seg(t,2.3,3.1));
  gH.setAttribute('transform','translate(70,'+lerp(300,236,he)+') scale('+lerp(1,.55,he)+')');
  hK.setAttribute('opacity',1-seg(t,2.2,2.7));
  hS.setAttribute('opacity',seg(t,1.0,1.7)*(1-seg(t,2.2,2.7)));

  /* cards */
  CARDS.forEach((r,i)=>{
    const a0=seg(t,2.9+i*.12,3.4+i*.12);
    const pre=t<r.s, done=t>=r.e;
    r.g.setAttribute('opacity',(a0*(pre?.45:done?.85:1)).toFixed(3));
    r.hl.setAttribute('opacity',(seg(t,r.s,r.s+.3)*(1-seg(t,r.e-.05,r.e+.3))).toFixed(3));
    r.chk.setAttribute('opacity',seg(t,r.e,r.e+.3).toFixed(3));
    if(r.li!==undefined){
      const o=POUR[r.li];const act=t>=o.ps&&t<o.pe;
      r.amtEl.textContent=(act?Math.round(o.vol*p[r.li]):o.vol)+' ml';
    }else r.amtEl.textContent=r.amt;
  });
  gChip.setAttribute('opacity',seg(t,3.5,4.1)*(1-seg(t,27.4,27.7)));

  /* glass */
  const go=26*(1-easeOut(seg(t,0,1)));
  gGl.setAttribute('transform','translate(0,'+go.toFixed(2)+')');

  const ys=[yTop(tops[0]),yTop(tops[1]),yTop(tops[2])];
  [[lay1,0,ys[0],col[0]],[lay2,1,ys[1],col[1]],[lay3,2,ys[2],col[2]]].forEach(([r,i,y,c])=>{
    r.setAttribute('visibility',p[i]>0?'visible':'hidden');
    r.setAttribute('y',y);r.setAttribute('height',BOT+10-y);r.setAttribute('fill',c);
  });
  const sy=yTop(L);
  surf.setAttribute('visibility',L>0?'visible':'hidden');surf.setAttribute('cy',sy);

  bub.forEach(b=>{
    if(L<=0){b.c.setAttribute('visibility','hidden');return}
    const ph=(t*b.sp+b.off)%1;const y=396-ph*(396-sy);
    if(y<sy+5||y>396){b.c.setAttribute('visibility','hidden');return}
    b.c.setAttribute('visibility','visible');
    b.c.setAttribute('cx',GX+b.u*Math.max(0,hw(y)-12));b.c.setAttribute('cy',y);b.c.setAttribute('r',b.r);
  });

  ICE.forEach((c,i)=>{
    const s=ICE_T0+i*ICE_GAP, g=cubes[i];
    if(t<s){g.setAttribute('visibility','hidden');return}
    g.setAttribute('visibility','visible');
    const pp=seg(t,s,s+.55);
    let off=-(c[1]+420)*(1-pp*pp);
    if(pp>=1){const b=seg(t,s+.55,s+.85);off-=12*Math.sin(Math.PI*b)*(1-b)}
    const rot=c[2]+(1-pp)*80*(i%2?1:-1);
    const ang=(t-21.9)*Math.PI*2*.75;
    const dx=7*stirW*Math.cos(ang+i), dy=4*stirW*Math.sin(ang+i*1.3);
    g.setAttribute('transform','translate('+(c[0]+dx).toFixed(1)+','+(c[1]+off-16*L+dy).toFixed(1)+') rotate('+(rot+stirW*6*Math.sin(ang+i)).toFixed(1)+')');
  });

  swirl1.setAttribute('opacity',(.6*stirW).toFixed(3));swirl2.setAttribute('opacity',(.6*stirW).toFixed(3));
  swirl1.setAttribute('stroke-dashoffset',(-t*160).toFixed(1));swirl2.setAttribute('stroke-dashoffset',(t*140).toFixed(1));

  const ang2=(t-21.9)*Math.PI*2*.75;
  const spv=ease(seg(t,21.5,22.1))-ease(seg(t,24.5,25.0));
  gSp.setAttribute('visibility',spv>0?'visible':'hidden');
  gSp.setAttribute('transform','translate('+(GX+Math.cos(ang2)*34).toFixed(1)+','+(332+Math.sin(ang2)*9-(1-spv)*700).toFixed(1)+')');

  /* bottle + stream */
  let bk=-1;POUR.forEach((o,i)=>{if(t>=o.s&&t<o.e)bk=i});
  let strOn=false;
  if(bk<0){gB.setAttribute('visibility','hidden')}
  else{
    const o=POUR[bk];
    const u=ease(seg(t,o.s,o.s+.9))-ease(seg(t,o.pe,o.e));
    gB.setAttribute('visibility','visible');
    const wob=(t>=o.ps&&t<o.pe)?Math.sin(t*18)*.8:0;
    const px=lerp(1500,668,u), py=lerp(330,132,u)+wob, ang=-105*u;
    gB.setAttribute('transform','translate('+px.toFixed(1)+','+py.toFixed(1)+') rotate('+ang.toFixed(1)+')');
    bBody.setAttribute('fill',o.body);bFoil.setAttribute('fill',o.foil);bFoil2.setAttribute('fill',o.foil);
    bLabel.setAttribute('fill',o.label);bTxt.setAttribute('fill',o.ltxt);bTxt.textContent=o.cap;
    if(t>=o.ps&&t<o.pe){
      strOn=true;
      const sx=px-4, y0=py+2, y1=yTop(L)+go;
      const a=seg(t,o.ps,o.ps+.2), b=seg(t,o.pe-.2,o.pe);
      const ya=lerp(y0,y1,b), yb=lerp(y0,y1,a);
      [strBase,strHi].forEach(s=>{s.setAttribute('x1',sx);s.setAttribute('x2',sx);s.setAttribute('y1',ya);s.setAttribute('y2',yb)});
      strBase.setAttribute('stroke',o.col);
      strHi.setAttribute('stroke-dashoffset',(-t*160).toFixed(1));
      rip.forEach((r,j)=>{const ph=((t-o.ps)*1.6+j*.5)%1;const rx=6+ph*40;
        r.setAttribute('cx',sx);r.setAttribute('cy',yTop(L));r.setAttribute('rx',rx);r.setAttribute('ry',rx*.22);r.setAttribute('opacity',((1-ph)*.7*a*(1-b)).toFixed(3));r.setAttribute('visibility','visible')});
    }
  }
  strBase.setAttribute('visibility',strOn?'visible':'hidden');strHi.setAttribute('visibility',strOn?'visible':'hidden');
  if(!strOn)rip.forEach(r=>r.setAttribute('visibility','hidden'));

  /* tags */
  const tagVis=1-seg(t,21.4,21.9);
  tags.forEach((tg,i)=>{
    const o=POUR[i];
    const lo=i===0?BOT:ys[i-1], hi=ys[i];
    const mid=(lo+hi)/2;
    const a=p[i]>0?seg(t,o.ps,o.ps+.4)*tagVis:0;
    tg.g.setAttribute('opacity',a.toFixed(3));
    const act=t>=o.ps&&t<o.pe;
    tg.am.textContent=(act?Math.round(o.vol*p[i]):o.vol)+' ml';
    tg.tx.setAttribute('y',(mid+9+go).toFixed(1));
    const x0=GX+hw(mid)+12;
    tg.ln.setAttribute('x1',x0);tg.ln.setAttribute('x2',812);tg.ln.setAttribute('y1',mid+go);tg.ln.setAttribute('y2',mid+go);
  });

  /* garnish */
  const gp=seg(t,25.0,25.8);
  if(t<25){gO.setAttribute('visibility','hidden')}
  else{
    gO.setAttribute('visibility','visible');
    let gy=lerp(-420,148,gp*gp);
    if(gp>=1){const b=seg(t,25.8,26.25);gy-=12*Math.sin(Math.PI*b)*(1-b)}
    const gx=lerp(960,774,easeOut(gp)), gr=lerp(220,14,easeOut(gp));
    gO.setAttribute('transform','translate('+gx.toFixed(1)+','+(gy+go).toFixed(1)+') rotate('+gr.toFixed(1)+')');
  }
  const sk=seg(t,25.8,26.5);
  spk.forEach((s,i)=>{
    const a=-Math.PI*.9+i*(Math.PI*.8/6);
    const r0=52+sk*8,r1=52+sk*30;
    s.setAttribute('x1',774+Math.cos(a)*r0);s.setAttribute('y1',148+go+Math.sin(a)*r0);
    s.setAttribute('x2',774+Math.cos(a)*r1);s.setAttribute('y2',148+go+Math.sin(a)*r1);
    s.setAttribute('opacity',(sk>0&&sk<1?1-sk:0).toFixed(3));
  });

  /* finale */
  const fe=ease(seg(t,27.6,28.3));
  gF.setAttribute('opacity',fe.toFixed(3));
  gF.setAttribute('transform','translate(0,'+((1-fe)*30).toFixed(1)+')');
  stars.forEach((s,i)=>{
    const sc=Math.max(0,Math.sin((t-27.8)*4+i*1.7))*fe;
    s.setAttribute('transform','translate('+SP0[i][0]+','+SP0[i][1]+') scale('+(sc*.9).toFixed(3)+')');
  });

  CAPS.forEach((c,i)=>{
    const a=seg(t,c.a,c.a+.35), b=1-seg(t,c.b-.3,c.b);
    caps[i].setAttribute('opacity',(a*b).toFixed(3));
    caps[i].setAttribute('transform','translate(0,'+((1-ease(a))*18).toFixed(1)+')');
  });
}

/* ---------- playback ---------- */
const playBtn=document.getElementById('play'),restartBtn=document.getElementById('restart'),scrub=document.getElementById('scrub'),timeEl=document.getElementById('time'),loopEl=document.getElementById('loop');
const RENDER=location.hash==='#render';
if(RENDER)document.documentElement.classList.add('render');
const REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let t=0,playing=!REDUCED&&!RENDER,last=null;
const fmt=s=>'0:'+String(Math.floor(s)).padStart(2,'0');
function paint(){render(t);scrub.value=Math.round(t*10);timeEl.textContent=fmt(t)+' / 0:30'}
function sync(){playBtn.textContent=playing?'Pausar':'Reproducir'}
function frame(ts){
  if(last===null)last=ts;const dt=Math.min(.1,(ts-last)/1000);last=ts;
  if(playing){t+=dt;if(t>=DUR){if(loopEl.checked)t=t%DUR;else{t=DUR;playing=false;sync()}}}
  paint();requestAnimationFrame(frame);
}
playBtn.addEventListener('click',()=>{if(!playing&&t>=DUR)t=0;playing=!playing;sync()});
restartBtn.addEventListener('click',()=>{t=0;playing=true;sync()});
scrub.addEventListener('input',()=>{t=scrub.value/10;paint()});
document.addEventListener('keydown',e=>{if(e.code==='Space'&&e.target===document.body){e.preventDefault();playBtn.click()}});
window.__film={render:x=>{t=x;render(x)},fontsReady:()=>document.fonts.ready};
sync();paint();
if(!RENDER)requestAnimationFrame(frame);
})();
</script>
