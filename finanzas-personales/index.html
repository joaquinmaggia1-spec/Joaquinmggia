<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mis Finanzas</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1c2330; --muted:#6b7385; --line:#e4e7ec;
  --primary:#2f6fed; --primary-soft:#e8effd; --good:#16a34a; --good-soft:#e7f6ec;
  --bad:#dc2626; --bad-soft:#fdecec; --warn:#d97706; --warn-soft:#fdf3e2;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f141c; --card:#171e29; --text:#e7ebf2; --muted:#94a0b4; --line:#273142;
    --primary:#5b8ff9; --primary-soft:#1d2a44; --good:#34d399; --good-soft:#123227;
    --bad:#f87171; --bad-soft:#3a1c1c; --warn:#fbbf24; --warn-soft:#3a2e12; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0f141c; --card:#171e29; --text:#e7ebf2; --muted:#94a0b4; --line:#273142;
  --primary:#5b8ff9; --primary-soft:#1d2a44; --good:#34d399; --good-soft:#123227;
  --bad:#f87171; --bad-soft:#3a1c1c; --warn:#fbbf24; --warn-soft:#3a2e12; --shadow:none;
}
*{box-sizing:border-box}
a{color:var(--primary)}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1200px;margin:0 auto;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;margin-right:auto}
nav{display:flex;gap:4px;overflow-x:auto;padding:0 16px 8px;max-width:1200px;margin:0 auto}
nav button{border:0;background:none;color:var(--muted);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap}
nav button.active{background:var(--primary-soft);color:var(--primary);font-weight:600}
main{max-width:1200px;margin:0 auto;padding:16px}
.grid{display:grid;gap:16px}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);min-width:0}
.card h3{margin:0 0 12px;font-size:14px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.kpi .s{color:var(--muted);font-size:12px;margin-top:4px}
.pos{color:var(--good)} .neg{color:var(--bad)} .muted{color:var(--muted)}
button.btn,.btn{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:3px 8px;font-size:12px}
input,select,textarea{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.form{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));align-items:end}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:12px;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 8px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:12px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;border-radius:99px}
.insight{display:flex;gap:10px;padding:10px 12px;border-radius:10px;margin-bottom:8px}
.insight.good{background:var(--good-soft)} .insight.bad{background:var(--bad-soft)} .insight.warn{background:var(--warn-soft)} .insight.info{background:var(--primary-soft)}
.legend{display:grid;gap:6px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);text-align:center;padding:24px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--text);padding:20px;width:min(560px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.4)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--card);color:var(--muted);padding:7px 12px;cursor:pointer;font:inherit}
.seg button.on{background:var(--primary);color:#fff}
.chart text{fill:var(--muted);font-size:11px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;pointer-events:none}
.toast.show{opacity:1}
@media (max-width:600px){.g2{grid-template-columns:1fr}.kpi .v{font-size:20px}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">💰 Mis Finanzas</div>
    <div class="row">
      <button class="btn sm" id="prevM" aria-label="Mes anterior">◀</button>
      <input type="month" id="month" style="width:auto">
      <button class="btn sm" id="nextM" aria-label="Mes siguiente">▶</button>
    </div>
    <button class="btn sm" id="syncBadge" data-v="ajustes" hidden></button>
    <button class="btn primary" id="quickAdd">＋ Movimiento</button>
  </div>
  <nav id="nav"></nav>
</header>
<main id="view"></main>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div class="toast" id="toast"></div>

<script>
/* ============================================================
   Mis Finanzas — app personal de gastos y análisis financiero.
   Todo se guarda en el navegador (localStorage) de tu compu.
   Hacé backups desde Ajustes → Exportar JSON.
   ============================================================ */
const KEY = 'misFinanzas.v1';
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $ = s => document.querySelector(s);
const todayISO = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const ym = d => d.slice(0, 7);
const PALETTE = ['#2f6fed','#16a34a','#d97706','#dc2626','#7c3aed','#0891b2','#db2777','#65a30d','#ea580c','#4f46e5','#0d9488','#a16207','#9333ea','#475569'];

function defaultState(){
  const cat = (name, kind, group, color, budget=0) => ({id:uid(), name, kind, group, color, budget});
  return {
    settings:{currency:'ARS', locale:'es-AR', theme:'auto', emergencyMonths:6},
    accounts:[
      {id:uid(), name:'Efectivo', type:'efectivo', initial:0},
      {id:uid(), name:'Cuenta bancaria', type:'banco', initial:0},
      {id:uid(), name:'Tarjeta de crédito', type:'tarjeta', initial:0},
    ],
    categories:[
      cat('Sueldo','ingreso','ingreso','#16a34a'),
      cat('Freelance / Extras','ingreso','ingreso','#0d9488'),
      cat('Vivienda (alquiler/expensas)','gasto','necesidad','#2f6fed'),
      cat('Servicios (luz, gas, internet)','gasto','necesidad','#0891b2'),
      cat('Supermercado','gasto','necesidad','#65a30d'),
      cat('Transporte','gasto','necesidad','#4f46e5'),
      cat('Salud','gasto','necesidad','#dc2626'),
      cat('Educación','gasto','necesidad','#7c3aed'),
      cat('Restaurantes / Delivery','gasto','deseo','#ea580c'),
      cat('Salidas y ocio','gasto','deseo','#db2777'),
      cat('Suscripciones','gasto','deseo','#9333ea'),
      cat('Ropa','gasto','deseo','#a16207'),
      cat('Regalos','gasto','deseo','#d97706'),
      cat('Ahorro / Inversión','gasto','ahorro','#16a34a'),
      cat('Deudas / Cuotas','gasto','ahorro','#475569'),
      cat('Otros','gasto','deseo','#94a3b8'),
    ],
    txs:[], recurring:[], goals:[], rules:[], deleted:{},
  };
}

let S = load();
function load(){
  try { const raw = localStorage.getItem(KEY); if (raw) return Object.assign(defaultState(), JSON.parse(raw)); } catch(e){}
  return defaultState();
}
function persist(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){ toast('No se pudo guardar (almacenamiento bloqueado)'); } }
function save(){ stamp(); persist(); scheduleSync(); }

/* ---------- Control de cambios (para sincronizar entre dispositivos) ----------
   Cada registro lleva "u" = momento de su última modificación. Al guardar se compara
   contra una foto del último estado: lo que cambió recibe nueva marca y lo que
   desapareció queda anotado en S.deleted, así el borrado llega a los otros dispositivos. */
const COLLS = ['accounts','categories','txs','recurring','goals','rules'];
let snap = {};
const strip = o => { const {u, ...rest} = o; return JSON.stringify(rest); };
function rebuildSnap(){ snap = {settings: strip(S.settings)}; for (const c of COLLS) for (const it of S[c]) snap[c+':'+it.id] = strip(it); }
function stamp(){
  const now = Date.now(), seen = {}; S.deleted ||= {};
  for (const c of COLLS) for (const it of S[c]){ const k=c+':'+it.id, j=strip(it); seen[k]=1; if (snap[k]!==j){ it.u=now; snap[k]=j; } }
  const sj = strip(S.settings); if (snap.settings!==sj){ S.settings.u=now; snap.settings=sj; }
  for (const k in snap) if (k!=='settings' && !seen[k]){ S.deleted[k.slice(k.indexOf(':')+1)] = now; delete snap[k]; }
}
// Une dos estados: por cada registro gana la versión modificada más recientemente; lo borrado no vuelve.
function mergeStates(a, b){
  const out = { settings: (b.settings?.u||0) > (a.settings?.u||0) ? b.settings : a.settings, deleted: {...(a.deleted||{})} };
  for (const [id,t] of Object.entries(b.deleted||{})) out.deleted[id] = Math.max(out.deleted[id]||0, t);
  for (const c of COLLS){
    const m = new Map();
    for (const it of [...(a[c]||[]), ...(b[c]||[])]){ if (out.deleted[it.id]) continue; const cur=m.get(it.id); if (!cur || (it.u||0) > (cur.u||0)) m.set(it.id, it); }
    out[c] = [...m.values()];
  }
  return out;
}

// Primera conexión combinando: las categorías/cuentas con el mismo nombre que en la nube se unifican (no se duplican).
function adoptIds(local, remote){
  const L = JSON.parse(JSON.stringify(local)), now = Date.now();
  for (const c of ['categories','accounts']){
    const drop = new Set();
    for (const it of L[c]){
      if ((remote[c]||[]).some(x=>x.id===it.id)) continue;
      const twin = (remote[c]||[]).find(x=>x.name.trim().toLowerCase()===it.name.trim().toLowerCase());
      if (!twin) continue;
      for (const t of [...L.txs, ...L.recurring, ...L.rules]) for (const f of ['categoryId','accountId','toAccountId']) if (t[f]===it.id){ t[f]=twin.id; t.u=now; }
      drop.add(it.id);
    }
    L[c] = L[c].filter(x=>!drop.has(x.id));
  }
  return L;
}

/* ---------- Sincronización con la nube (solo al usar la app desde el link de Vercel) ---------- */
const SYNC_KEY = 'misFinanzas.syncKey', SYNC_INIT = 'misFinanzas.syncInit';
const canSync = location.protocol.startsWith('http');
const lsGet = k => { try { return localStorage.getItem(k); } catch(e){ return null; } };
const lsSet = (k,v) => { try { v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); } catch(e){} };
let syncStatus = 'off', syncing = false, syncAgain = false, syncTimer;
let cloud = null; // null = sin comprobar, {configured, hasPassword} o {configured:false}
async function checkCloud(){
  if (!canSync) return;
  try { const r = await fetch('api/sync?check', {cache:'no-store'}); cloud = r.ok ? await r.json() : {configured:false}; }
  catch(e){ cloud = {configured:false, offline:true}; }
  if (curView==='ajustes' && !$('#dlg').open && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')) render();
  if (!lsGet(SYNC_KEY)) setSync('off');
}
const SYNC_LABEL = {off: canSync ? '☁️ Activar sincronización' : '', busy:'🔄 Sincronizando…', ok:'☁️ Sincronizado', error:'⚠️ Sin conexión', auth:'🔒 Clave incorrecta', locked:'🔒 Bloqueado 15 min', setup:'⚙️ Falta configurar la nube'};
function setSync(st){ syncStatus=st; const b=$('#syncBadge'); if (b){ b.textContent=SYNC_LABEL[st]; b.hidden=!SYNC_LABEL[st]; } const s=$('#syncStatusTxt'); if (s) s.textContent=SYNC_LABEL[st]||'Desconectado'; }
function scheduleSync(){ if (!canSync || !lsGet(SYNC_KEY)) return; clearTimeout(syncTimer); syncTimer=setTimeout(sync, 1200); }
async function syncApi(method, body){
  const r = await fetch('api/sync', {method, cache:'no-store', headers:{'Content-Type':'application/json','X-Sync-Key':lsGet(SYNC_KEY)||''}, body: body && JSON.stringify(body)});
  let j = {}; try { j = await r.json(); } catch(e){}
  return {status:r.status, ...j};
}
async function sync(){
  if (!canSync || !lsGet(SYNC_KEY)) return setSync('off');
  if (syncing){ syncAgain=true; return; }
  syncing=true; setSync('busy');
  try {
    for (let attempt=0; attempt<4; attempt++){
      const g = await syncApi('GET');
      if (g.status===401) return setSync('auth');
      if (g.status===429) return setSync('locked');
      if (g.status===503) return setSync('setup');
      if (g.status!==200) throw new Error('HTTP '+g.status);
      let next, adopt=false, first=false;
      if (!g.data) next = S;
      else if (!lsGet(SYNC_INIT) && S.txs.length && confirm('Ya hay datos en la nube. ¿Querés COMBINARLOS con los de este dispositivo?\n\nAceptar = combinar ambos\nCancelar = usar solo los de la nube (se descartan los de este dispositivo)')){ first=true; next = mergeStates(adoptIds(S, g.data), g.data); }
      else if (!lsGet(SYNC_INIT)){ next = g.data; adopt = true; }
      else next = mergeStates(S, g.data);
      if (!adopt){
        const p = await syncApi('PUT', {data: next, baseVersion: g.version});
        if (p.status===409) continue; // otro dispositivo guardó justo ahora: reintentar
        if (p.status!==200) throw new Error('HTTP '+p.status);
      }
      const before = JSON.stringify(S);
      S = adopt ? Object.assign(defaultState(), next) : mergeStates(first ? adoptIds(S, next) : S, next); // conserva lo cargado mientras sincronizaba
      rebuildSnap(); persist(); lsSet(SYNC_INIT,'1'); setSync('ok');
      if (JSON.stringify(S)!==before && !$('#dlg').open && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'')) render();
      return;
    }
    throw new Error('conflicto');
  } catch(e){ setSync('error'); }
  finally { syncing=false; if (syncAgain){ syncAgain=false; scheduleSync(); } }
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('show'),2200); }

const money = (n, opts={}) => {
  try { return new Intl.NumberFormat(S.settings.locale, {style:'currency', currency:S.settings.currency, maximumFractionDigits: opts.dec ?? 0}).format(n||0); }
  catch(e){ return (n||0).toFixed(0); }
};
const pct = n => isFinite(n) ? (n*100).toFixed(0)+'%' : '—';
const catById = id => S.categories.find(c=>c.id===id);
const accById = id => S.accounts.find(a=>a.id===id);

/* ---------- Estado de UI ---------- */
let curMonth = ym(todayISO());
let curView = 'panel';
let txFilter = {q:'', cat:'', acc:'', type:''};

/* ---------- Cálculos ---------- */
const txsOfMonth = m => S.txs.filter(t => ym(t.date) === m);
function totals(m){
  let inc=0, exp=0; const byCat={}, byGroup={necesidad:0,deseo:0,ahorro:0};
  for (const t of txsOfMonth(m)){
    if (t.type==='ingreso') inc += t.amount;
    else if (t.type==='gasto'){
      exp += t.amount; byCat[t.categoryId]=(byCat[t.categoryId]||0)+t.amount;
      const g = catById(t.categoryId)?.group || 'deseo'; byGroup[g]=(byGroup[g]||0)+t.amount;
    }
  }
  return {inc, exp, net:inc-exp, byCat, byGroup};
}
function accountBalance(a, upTo){
  let b = Number(a.initial)||0;
  for (const t of S.txs){
    if (upTo && t.date > upTo) continue;
    if (t.type==='ingreso' && t.accountId===a.id) b += t.amount;
    if (t.type==='gasto' && t.accountId===a.id) b -= t.amount;
    if (t.type==='transferencia'){ if (t.accountId===a.id) b -= t.amount; if (t.toAccountId===a.id) b += t.amount; }
  }
  return b;
}
const netWorth = upTo => S.accounts.reduce((s,a)=>s+accountBalance(a,upTo),0);
function shiftMonth(m, k){ const [y,mo]=m.split('-').map(Number); const d=new Date(y, mo-1+k, 1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
const monthLabel = (m, short) => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo-1,1).toLocaleDateString('es-AR',{month: short?'short':'long', year: short?'2-digit':'numeric'}); };
const lastDay = m => { const [y,mo]=m.split('-').map(Number); return new Date(y,mo,0).getDate(); };
function avgExpense(m, n=3){ let s=0,c=0; for(let i=1;i<=n;i++){ const t=totals(shiftMonth(m,-i)); if(t.exp>0){s+=t.exp;c++;} } return c? s/c : 0; }

/* ---------- Recurrentes: se registran solos al llegar su día ---------- */
function applyRecurring(){
  const today = todayISO(); let added=0;
  for (const r of S.recurring){
    if (!r.active) continue;
    let m = r.lastApplied ? shiftMonth(r.lastApplied,1) : (r.startMonth || ym(today));
    while (m <= ym(today)){
      const day = String(Math.min(r.day, lastDay(m))).padStart(2,'0');
      const date = m+'-'+day;
      if (date > today) break;
      const id = 'rec_'+r.id+'_'+m; // id fijo por mes: si dos dispositivos lo registran, no se duplica
      if (!S.txs.some(t=>t.id===id) && !S.deleted?.[id]){ S.txs.push({id, date, type:r.type, amount:r.amount, accountId:r.accountId, categoryId:r.categoryId, note:r.name+' (recurrente)', recurringId:r.id}); added++; }
      r.lastApplied = m; m = shiftMonth(m,1);
    }
  }
  save();
  if (added){ setTimeout(()=>toast(`Se registraron ${added} movimiento(s) recurrente(s)`),300); }
}

/* ---------- Gráficos SVG (sin dependencias, funciona offline) ---------- */
function donut(items, size=180){
  const total = items.reduce((s,i)=>s+i.value,0);
  if (!total) return '<div class="empty">Sin gastos este mes</div>';
  const r=size/2-14, c=2*Math.PI*r; let off=0;
  const arcs = items.map(i=>{ const len=i.value/total*c; const s=`<circle r="${r}" cx="${size/2}" cy="${size/2}" fill="none" stroke="${i.color}" stroke-width="22" stroke-dasharray="${len} ${c-len}" stroke-dashoffset="${-off}"><title>${esc(i.label)}: ${money(i.value)} (${pct(i.value/total)})</title></circle>`; off+=len; return s; }).join('');
  return `<svg class="chart" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" style="transform:rotate(-90deg);flex:none">${arcs}</svg>`;
}
function barsChart(months, W=640){
  const H=220,P=34; const max=Math.max(1,...months.flatMap(m=>[m.inc,m.exp]));
  const bw=(W-P-10)/months.length;
  let g='';
  for (let k=0;k<=4;k++){ const y=H-24-(H-44)*k/4; g+=`<line x1="${P}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${P-4}" y="${y+4}" text-anchor="end">${short(max*k/4)}</text>`; }
  months.forEach((m,i)=>{
    const x=P+6+i*bw, h1=(H-44)*m.inc/max, h2=(H-44)*m.exp/max, w=Math.max(4,bw/2-5);
    g+=`<rect x="${x}" y="${H-24-h1}" width="${w}" height="${h1}" rx="3" fill="var(--good)"><title>Ingresos ${monthLabel(m.m)}: ${money(m.inc)}</title></rect>`;
    g+=`<rect x="${x+w+2}" y="${H-24-h2}" width="${w}" height="${h2}" rx="3" fill="var(--bad)"><title>Gastos ${monthLabel(m.m)}: ${money(m.exp)}</title></rect>`;
    g+=`<text x="${x+w}" y="${H-8}" text-anchor="middle">${monthLabel(m.m,true)}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
function lineChart(points){
  const W=640,H=180,P=40; const vals=points.map(p=>p.v); const min=Math.min(0,...vals), max=Math.max(1,...vals);
  const x=i=>P+i*(W-P-10)/Math.max(1,points.length-1), y=v=>H-22-(H-40)*(v-min)/(max-min||1);
  let g=''; for(let k=0;k<=3;k++){ const v=min+(max-min)*k/3; g+=`<line x1="${P}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${P-4}" y="${y(v)+4}" text-anchor="end">${short(v)}</text>`; }
  g+=`<polyline fill="none" stroke="var(--primary)" stroke-width="2.5" points="${points.map((p,i)=>x(i)+','+y(p.v)).join(' ')}"/>`;
  points.forEach((p,i)=>{ g+=`<circle cx="${x(i)}" cy="${y(p.v)}" r="3.5" fill="var(--primary)"><title>${monthLabel(p.m)}: ${money(p.v)}</title></circle><text x="${x(i)}" y="${H-6}" text-anchor="middle">${monthLabel(p.m,true)}</text>`; });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>`;
}
function short(n){ const a=Math.abs(n); return (n<0?'-':'')+(a>=1e6?(a/1e6).toFixed(1)+'M':a>=1e3?(a/1e3).toFixed(0)+'k':a.toFixed(0)); }
function progress(ratio, color){ const w=Math.min(100,Math.max(0,ratio*100)); return `<div class="bar"><span style="width:${w}%;background:${color}"></span></div>`; }

/* ---------- Análisis automático (insights) ---------- */
function insights(m){
  const t=totals(m), prev=totals(shiftMonth(m,-1)), out=[];
  const add=(kind,icon,html)=>out.push(`<div class="insight ${kind}"><span>${icon}</span><div>${html}</div></div>`);
  if (!t.inc && !t.exp) { add('info','👋','Todavía no cargaste movimientos este mes. Empezá con <b>＋ Movimiento</b>.'); return out.join(''); }
  if (t.inc){
    const rate=t.net/t.inc;
    if (rate>=0.2) add('good','🎯',`Tasa de ahorro del <b>${pct(rate)}</b>. Superás el 20% recomendado. ¡Excelente!`);
    else if (rate>=0) add('warn','📉',`Tasa de ahorro del <b>${pct(rate)}</b>. La meta saludable es 20% o más: te faltan ${money(t.inc*0.2-t.net)}.`);
    else add('bad','🚨',`Gastaste <b>${money(-t.net)}</b> más de lo que ingresó este mes.`);
  }
  if (prev.exp){
    const d=(t.exp-prev.exp)/prev.exp;
    if (Math.abs(d)>=0.1) add(d>0?'warn':'good', d>0?'⬆️':'⬇️', `Tus gastos ${d>0?'subieron':'bajaron'} <b>${pct(Math.abs(d))}</b> respecto de ${monthLabel(shiftMonth(m,-1))}.`);
  }
  const over = S.categories.filter(c=>c.kind==='gasto' && c.budget>0 && (t.byCat[c.id]||0)>c.budget);
  if (over.length) add('bad','🧾',`Excediste el presupuesto en: ${over.map(c=>`<b>${esc(c.name)}</b> (+${money((t.byCat[c.id]||0)-c.budget)})`).join(', ')}.`);
  const top = Object.entries(t.byCat).sort((a,b)=>b[1]-a[1])[0];
  if (top && t.exp) add('info','🔎',`Tu mayor gasto es <b>${esc(catById(top[0])?.name||'Sin categoría')}</b>: ${money(top[1])} (${pct(top[1]/t.exp)} del total).`);
  if (m===ym(todayISO()) && t.exp){
    // Los pagos grandes (alquiler, cuotas, recurrentes) no se repiten: solo se proyecta el gasto chico/diario.
    const day=new Date().getDate(), big=Math.max(1,(avgExpense(m)||t.exp)*0.1);
    const exps=txsOfMonth(m).filter(x=>x.type==='gasto'), fixed=exps.filter(x=>x.recurringId||x.amount>=big).reduce((s,x)=>s+x.amount,0);
    const proj=fixed+(t.exp-fixed)/day*lastDay(m);
    if (day>=3) add('info','📅',`A este ritmo vas a cerrar el mes con unos <b>${money(proj)}</b> de gastos${t.inc?` (${pct(proj/t.inc)} de tus ingresos)`:''}.`);
  }
  if (t.inc){
    const w=t.byGroup.deseo/t.inc; if (w>0.3) add('warn','🛍️',`Los "deseos" son el ${pct(w)} de tus ingresos (ideal ≤ 30%).`);
  }
  const avg=avgExpense(m)||t.exp, liquid=S.accounts.filter(a=>a.type!=='tarjeta' && a.type!=='inversion').reduce((s,a)=>s+accountBalance(a),0);
  if (avg>0){
    const months=liquid/avg, target=S.settings.emergencyMonths||6;
    add(months>=target?'good':months>=3?'warn':'bad','🛟',`Tu dinero líquido cubre <b>${months.toFixed(1)} meses</b> de gastos (objetivo de fondo de emergencia: ${target}).`);
  }
  const subs = S.recurring.filter(r=>r.active && r.type==='gasto').reduce((s,r)=>s+r.amount,0);
  if (subs) add('info','🔁',`Tus gastos fijos recurrentes suman ${money(subs)}/mes → <b>${money(subs*12)}</b> al año.`);
  return out.join('');
}

function rule503020(t){
  if (!t.inc) return '<div class="empty">Cargá tus ingresos del mes para ver la distribución.</div>';
  const rows=[['necesidad','Necesidades',0.5,'var(--primary)'],['deseo','Deseos',0.3,'var(--warn)'],['ahorro','Ahorro + deudas',0.2,'var(--good)']];
  const savedExtra = Math.max(0,t.net); // lo no gastado también es ahorro
  return rows.map(([g,l,ideal,col])=>{
    const v = g==='ahorro' ? t.byGroup.ahorro+savedExtra : t.byGroup[g];
    const r=v/t.inc, ok = g==='ahorro' ? r>=ideal : r<=ideal;
    return `<div style="margin-bottom:14px"><div class="row"><b>${l}</b><span class="muted">ideal ${g==='ahorro'?'≥':'≤'} ${pct(ideal)}</span><span style="margin-left:auto" class="${ok?'pos':'neg'}">${pct(r)} · ${money(v)}</span></div><div style="position:relative">${progress(r,col)}<span style="position:absolute;top:-3px;left:${ideal*100}%;width:2px;height:14px;background:var(--muted)" title="Ideal"></span></div></div>`;
  }).join('') + '<div class="muted" style="font-size:12px">Clasificá cada categoría como Necesidad / Deseo / Ahorro en Ajustes. Lo que te sobra a fin de mes cuenta como ahorro.</div>';
}

function viewAnalysis(){
  const months=[...Array(12)].map((_,i)=>{ const m=shiftMonth(curMonth,i-11); return {m,...totals(m)}; });
  const withData=months.filter(m=>m.inc||m.exp);
  const avgInc=withData.reduce((s,m)=>s+m.inc,0)/(withData.length||1), avgExp=withData.reduce((s,m)=>s+m.exp,0)/(withData.length||1);
  const cats=S.categories.filter(c=>c.kind==='gasto');
  const matrix=cats.map(c=>({c, vals:months.slice(-6).map(m=>m.byCat[c.id]||0)})).filter(r=>r.vals.some(v=>v));
  const cur=totals(curMonth), avg3={}; cats.forEach(c=>{ let s=0; for(let i=1;i<=3;i++) s+=totals(shiftMonth(curMonth,-i)).byCat[c.id]||0; avg3[c.id]=s/3; });
  const anomalies=cats.filter(c=>avg3[c.id]>0 && (cur.byCat[c.id]||0)>avg3[c.id]*1.3).map(c=>({c,cur:cur.byCat[c.id],avg:avg3[c.id]}));
  return `<div class="grid g4">

  </div>
  <div class="card" style="margin-top:16px"><h3>Ingresos vs gastos (12 meses)</h3>${barsChart(months,1000)}</div>

/* ---------- Importar / exportar ---------- */
function download(name, content, type){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([content],{type})); a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),1000); }
function parseCSV(text){
  const sep = (text.split('\n')[0].match(/;/g)||[]).length > (text.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
  const rows=[]; let row=[], cell='', q=false;
  for (let i=0;i<text.length;i++){ const ch=text[i];
    if (q){ if (ch==='"'){ if (text[i+1]==='"'){cell+='"';i++;} else q=false; } else cell+=ch; }
    else if (ch==='"') q=true; else if (ch===sep){ row.push(cell); cell=''; } else if (ch==='\n'){ row.push(cell); rows.push(row); row=[]; cell=''; } else if (ch!=='\r') cell+=ch; }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(c=>c.trim()));
}
function parseDate(s){ s=s.trim(); let m;
  if ((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  if ((m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/))) return `${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null; }
function importCSV(text){
  const rows=parseCSV(text); if (!rows.length) return toast('Archivo vacío');
  const head=rows[0].map(h=>h.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').trim());
  const find=(...k)=>head.findIndex(h=>k.some(x=>h.includes(x)));
  let iD=find('fecha','date'), iN=find('desc','concepto','detalle','note','nota'), iA=find('monto','importe','amount','valor'), iC=find('categ');
  let body=rows.slice(1); if (iD<0||iA<0){ iD=0; iN=1; iA=2; iC=-1; body=rows; }
  const acc=S.accounts.find(a=>a.type==='banco')||S.accounts[0]; let n=0;
  for (const r of body){ const date=parseDate(r[iD]||''); const v=parseNum(r[iA]||''); if (!date||!v) continue;
    const note=(iN>=0?r[iN]:'').trim(); let cat=applyRules(note);
    if (!cat && iC>=0){ cat=S.categories.find(c=>c.name.toLowerCase()===(r[iC]||'').trim().toLowerCase())?.id; }
    S.txs.push({id:uid(), date, type:v<0?'gasto':'ingreso', amount:Math.abs(v), accountId:acc?.id, categoryId:cat||null, note}); n++; }
  save(); render(); toast(`Se importaron ${n} movimientos en "${acc?.name}"`);
}
function exportCSV(){
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const lines=[['fecha','tipo','descripcion','categoria','cuenta','hacia','monto'].join(',')];
  [...S.txs].sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>lines.push([t.date,t.type,q(t.note),q(catById(t.categoryId)?.name),q(accById(t.accountId)?.name),q(accById(t.toAccountId)?.name),(t.type==='gasto'?-t.amount:t.amount)].join(',')));
  download(`movimientos-${todayISO()}.csv`, '﻿'+lines.join('\n'), 'text/csv');
}
function loadDemo(){
  const C=n=>S.categories.find(c=>c.name.startsWith(n))?.id, bank=S.accounts.find(a=>a.type==='banco')?.id||S.accounts[0].id, cash=S.accounts.find(a=>a.type==='efectivo')?.id||bank, card=S.accounts.find(a=>a.type==='tarjeta')?.id||bank;
  const r=(a,b)=>Math.round(a+Math.random()*(b-a));
  for (let k=5;k>=0;k--){ const m=shiftMonth(ym(todayISO()),-k), last=k===0?new Date().getDate():lastDay(m), d=x=>m+'-'+String(Math.min(x,last)).padStart(2,'0');
    const add=(day,type,amount,cat,acc,note)=>day<=last && S.txs.push({id:uid(),date:d(day),type,amount,categoryId:C(cat),accountId:acc,note,demo:true});
    add(1,'ingreso',1500000,'Sueldo',bank,'Sueldo'); if (k%2===0) add(15,'ingreso',r(150000,400000),'Freelance',bank,'Proyecto freelance');
    add(5,'gasto',450000,'Vivienda',bank,'Alquiler'); add(10,'gasto',r(60000,95000),'Servicios',bank,'Luz, gas e internet');
    for (let i=0;i<4;i++) add(3+i*7,'gasto',r(45000,90000),'Supermercado',card,'Supermercado');
    add(r(1,last),'gasto',r(30000,60000),'Transporte',cash,'SUBE / combustible');
    for (let i=0;i<r(2,5);i++) add(r(1,last),'gasto',r(12000,35000),'Restaurantes',card,'Delivery');
    add(r(1,last),'gasto',r(20000,80000),'Salidas',cash,'Salida con amigos'); add(8,'gasto',18500,'Suscripciones',card,'Netflix + Spotify');
    if (Math.random()>.5) add(r(1,last),'gasto',r(40000,120000),'Ropa',card,'Ropa');
    add(2,'gasto',200000,'Ahorro',bank,'Compra de dólares / plazo fijo'); }
  const b=(n,v)=>{ const c=S.categories.find(c=>c.name.startsWith(n)); if(c&&!c.budget) c.budget=v; };
  b('Vivienda',450000); b('Servicios',90000); b('Supermercado',300000); b('Transporte',50000); b('Restaurantes',80000); b('Salidas',60000); b('Suscripciones',20000);
  if (!S.goals.length) S.goals.push({id:uid(),name:'Fondo de emergencia',target:6000000,saved:1200000,deadline:shiftMonth(ym(todayISO()),12)});
  if (!S.rules.length) S.rules.push({id:uid(),keyword:'netflix',categoryId:C('Suscripciones')},{id:uid(),keyword:'uber',categoryId:C('Transporte')});
  save(); render(); toast('Datos de ejemplo cargados');

document.addEventListener('click', e=>{
  const el=e.target.closest('button,[data-go]'); if (!el) return; const ds=el.dataset;
  const del=(arr,id,msg)=>{ if (confirm(msg)){ const i=arr.findIndex(x=>x.id===id); arr.splice(i,1); save(); render(); } };
  if (ds.v){ curView=ds.v; render(); window.scrollTo(0,0); }
  else if (ds.go){ curView=ds.go; render(); }
  else if (ds.editTx) txDialog(S.txs.find(t=>t.id===ds.editTx));
  else if (ds.delTx) del(S.txs, ds.delTx, '¿Eliminar este movimiento?');
  else if (ds.editAcc) accDialog(accById(ds.editAcc));
  else if (ds.delAcc){ if (S.txs.some(t=>t.accountId===ds.delAcc||t.toAccountId===ds.delAcc)) return toast('La cuenta tiene movimientos: no se puede eliminar'); del(S.accounts, ds.delAcc, '¿Eliminar cuenta?'); }
  else if (ds.editCat) catDialog(catById(ds.editCat));
  else if (ds.delCat){ if (S.txs.some(t=>t.categoryId===ds.delCat)) return toast('La categoría tiene movimientos: editala en vez de borrarla'); del(S.categories, ds.delCat, '¿Eliminar categoría?'); }
  else if (ds.editRec) recDialog(S.recurring.find(r=>r.id===ds.editRec));
  else if (ds.delRec) del(S.recurring, ds.delRec, '¿Eliminar recurrente? (los movimientos ya registrados se conservan)');
  else if (ds.editGoal) goalDialog(S.goals.find(g=>g.id===ds.editGoal));
  else if (ds.delGoal) del(S.goals, ds.delGoal, '¿Eliminar meta?');
  else if (ds.delRule) del(S.rules, ds.delRule, '¿Eliminar regla?');
  else if (ds.goalAdd){ const g=S.goals.find(x=>x.id===ds.goalAdd); const v=parseNum(prompt(`¿Cuánto aportás a "${g.name}"?`)||''); if (v){ g.saved+=v; save(); render(); toast('Aporte registrado'); } }
  else switch(el.id){
    case 'quickAdd': txDialog(); break;
    case 'prevM': curMonth=shiftMonth(curMonth,-1); render(); break;
    case 'nextM': curMonth=shiftMonth(curMonth,1); render(); break;
    case 'addAcc': accDialog(); break; case 'addCat': catDialog(); break; case 'addRec': recDialog(); break;
    case 'addGoal': goalDialog(); break; case 'addRule': ruleDialog(); break;
    case 'expJson': download(`mis-finanzas-backup-${todayISO()}.json`, JSON.stringify(S,null,2), 'application/json'); break;
    case 'expCsv': exportCSV(); break;
    case 'demo': if (confirm('Se agregarán 6 meses de movimientos de ejemplo. ¿Continuar?')) loadDemo(); break;
    case 'syncOn': { const v=$('#syncPass').value.trim(); if (v.length<6) return toast('La clave debe tener al menos 6 caracteres'); lsSet(SYNC_KEY,v); lsSet(SYNC_INIT,null);
      sync().then(()=>{ if (syncStatus==='auth'){ lsSet(SYNC_KEY,null); toast('Clave incorrecta'); } else if (syncStatus==='ok') toast('¡Dispositivo conectado!'); else if (syncStatus==='setup') toast('Falta configurar la base de datos o la clave en Vercel'); else if (syncStatus==='locked'){ lsSet(SYNC_KEY,null); toast('Demasiados intentos: esperá 15 minutos'); } render(); }); break; }
    case 'syncNow': sync(); break;
    case 'cloudCheck': cloud=null; checkCloud().then(()=>toast(cloud?.configured?'¡La nube está conectada!':'Todavía no está conectada')); break;
    case 'syncOff': if (confirm('Este dispositivo deja de sincronizar (tus datos quedan guardados acá y en la nube).')){ lsSet(SYNC_KEY,null); lsSet(SYNC_INIT,null); setSync('off'); render(); } break;
    case 'wipe': if (confirm('Esto borra TODOS tus datos. ¿Seguro? (Hacé un backup antes)')){ S=defaultState(); save(); render(); } break;
    case 'copyAvg': S.categories.filter(c=>c.kind==='gasto').forEach(c=>{ let s=0; for(let i=1;i<=3;i++) s+=totals(shiftMonth(curMonth,-i)).byCat[c.id]||0; if (s) c.budget=Math.round(s/3); }); save(); render(); toast('Presupuesto sugerido según tus últimos 3 meses'); break;
  }
});
document.addEventListener('change', e=>{
  const el=e.target;
  if (el.id==='month' && el.value){ curMonth=el.value; render(); }
  else if (el.dataset.budget){ const c=catById(el.dataset.budget); c.budget=parseNum(el.value); save(); render(); }
  else if (el.id==='ft'){ txFilter.type=el.value; render(); } else if (el.id==='fc'){ txFilter.cat=el.value; render(); } else if (el.id==='fa'){ txFilter.acc=el.value; render(); }
  else if (el.id==='setCur'){ S.settings.currency=el.value; save(); render(); }
  else if (el.id==='setTheme'){ S.settings.theme=el.value; save(); render(); }
  else if (el.id==='setEm'){ S.settings.emergencyMonths=Math.max(1,+el.value||6); save(); }
  else if (el.id==='impJson' && el.files[0]){ el.files[0].text().then(t=>{ try{ const d=JSON.parse(t); if(!d.txs||!d.categories) throw 0; if(confirm('Esto reemplaza tus datos actuales por el backup. ¿Continuar?')){ S=Object.assign(defaultState(),d); save(); render(); toast('Backup restaurado'); } }catch(_){ toast('Archivo de backup inválido'); } }); }
  else if (el.id==='impCsv' && el.files[0]){ el.files[0].text().then(importCSV); }
});
document.addEventListener('input', e=>{ if (e.target.id==='fq'){ txFilter.q=e.target.value; const pos=e.target.selectionStart; render(); const f=$('#fq'); f.focus(); f.setSelectionRange(pos,pos); } });
document.addEventListener('keydown', e=>{ if (e.key==='n' && !e.ctrlKey && !e.metaKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) && !$('#dlg').open){ e.preventDefault(); txDialog(); } });

rebuildSnap();
applyRecurring();
render();
if (canSync){
  checkCloud();
  sync();
  document.addEventListener('visibilitychange', ()=>{ if (document.visibilityState==='visible') sync(); });
  window.addEventListener('online', sync);
  setInterval(()=>{ if (document.visibilityState==='visible') sync(); }, 30000);
}
</script>
</body>
</html>
