<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:M;src:url(montserrat.woff2) format("woff2");font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:1080px;height:1920px;overflow:hidden;background:#0b0b0c;font-family:M,sans-serif}
.bg{position:absolute;inset:0;background:url(fondo.jpg) center/cover}
.t{position:absolute;left:100px;width:808px;top:250px;text-align:center;color:#fff;font-weight:900;font-size:128px;line-height:.95;letter-spacing:-.03em;text-shadow:0 8px 30px rgba(0,0,0,.8)}
.t span{color:#ff3b4e;text-shadow:0 0 30px rgba(255,59,78,.5),0 8px 30px rgba(0,0,0,.8)}
.t2{position:absolute;left:100px;width:808px;top:660px;text-align:center;color:#d4ff3a;font-weight:900;font-size:92px;letter-spacing:-.02em;text-shadow:0 0 30px rgba(212,255,58,.6),0 8px 30px rgba(0,0,0,.7)}

.av{width:48px;height:48px;border-radius:50%;background:linear-gradient(135deg,#d4ff3a,#2fbf71)}
.post img{display:block;width:600px;height:380px;object-fit:cover}
.btn{margin:20px 22px 22px;height:84px;border-radius:16px;background:#0095f6;color:#fff;font-weight:700;font-size:34px;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;left:504px;top:1365px;width:170px;height:170px;margin:-85px 0 0 -85px;border-radius:50%;border:8px solid #ff3b4e;box-shadow:0 0 30px rgba(255,59,78,.7)}
.x{position:absolute;left:640px;top:1250px;width:150px;height:150px}
</style></head><body><div class="bg"></div>
